        <ul data-state="default" class="grid gap-4 md:grid-cols-2" data-i18n-attr="aria-label:teacher.courses.listLabel">
          <li><a href="course.html" class="group flex h-full flex-col gap-3 rounded-xl border border-border bg-surface-raised shadow-sm p-5 hover:border-border-strong hover:shadow-md focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus" data-component="Card" data-variant="interactive"><span class="flex items-start justify-between gap-3"><span class="text-lg font-semibold text-fg group-hover:text-primary-700" data-i18n="sample.course.name"></span><svg class="mt-1 size-5 text-fg-muted shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#chevron-right"/></svg></span><span class="flex flex-wrap gap-x-4 gap-y-1 text-sm text-fg-muted"><span class="inline-flex items-center gap-1.5"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#users"/></svg><span class="tabular-nums" data-i18n="teacher.courses.students" data-i18n-count="24"></span></span><span class="inline-flex items-center gap-1.5"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#clock"/></svg><span class="tabular-nums" data-i18n="teacher.courses.created" data-i18n-vars='{"date": "date:2026-10-04"}'></span></span></span></a></li>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat del curso · DocentAI (prototipo)</title>
    <style>
      :root { color-scheme: light dark; }
      [data-cloak] { visibility: hidden; }
      [data-cloak] *, [data-cloak] *::before, [data-cloak] *::after { transition: none !important; }
      summary::-webkit-details-marker { display: none; }
    </style>
    <script type="module" src="../assets/js/prototype.js"></script>
  </head>
  <body data-cloak class="flex min-h-dvh flex-col bg-surface font-sans text-fg antialiased">
    <a href="#main" class="sr-only rounded-lg bg-primary-700 px-4 py-2 text-fg-inverse focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-50" data-i18n="common.a11y.skipToContent"></a>
    <div data-include="partials/shell-student.html"></div>
    <main id="main" tabindex="-1" class="mx-auto flex w-full max-w-4xl flex-1 flex-col gap-8 px-4 pt-8 sm:px-6 lg:pt-12">

      <!-- Notebook page header: the course is the subject written at the top of the page. -->
      <div class="flex flex-col gap-4 border-b-2 border-neutral-900 pb-4">
        <div class="min-w-0 flex-1">
          <h1 class="text-3xl font-semibold text-fg sm:text-4xl" data-i18n="sample.course.name"></h1>
          <p class="mt-2 flex items-center gap-2 text-sm text-teacher-700"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#graduation-cap"/></svg><span data-i18n="student.chat.teacherLine" data-i18n-vars='{"teacher": "sample.people.teacher"}'></span></p>
        </div>
        <div class="flex shrink-0 flex-wrap gap-2">
          <button type="button" data-goto="tutor-info" class="inline-flex min-h-11 items-center justify-center gap-2 rounded-lg border border-border-strong bg-surface-raised px-4 text-sm font-semibold text-fg hover:bg-surface-sunken focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus md:min-h-9" data-component="Button" data-variant="secondary"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#settings"/></svg><span data-i18n="student.chat.tutorInfo.open"></span></button>
          <a href="courses.html" class="inline-flex min-h-11 items-center justify-center gap-2 rounded-lg border border-border-strong bg-surface-raised px-4 text-sm font-semibold text-fg hover:bg-surface-sunken focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus md:min-h-9" data-component="Button" data-variant="secondary"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#book-open"/></svg><span data-i18n="student.chat.switchCourse"></span></a>
        </div>
      </div>

      <section aria-labelledby="conversation-title" class="flex flex-1 flex-col gap-8">
        <h2 id="conversation-title" class="sr-only" data-i18n="student.chat.conversation"></h2>

        <div data-state="loading" class="flex flex-col gap-6" data-component="Skeleton">
          <p role="status" class="sr-only" data-i18n="common.states.loading"></p>
          <div class="flex flex-col gap-6 motion-safe:animate-pulse" aria-hidden="true">
            <div class="grid gap-6 lg:grid-cols-12"><div class="flex flex-col gap-2 rounded-lg bg-surface p-4 lg:col-span-9"><div class="h-4 w-1/4 rounded-sm bg-neutral-200"></div><div class="h-4 w-full rounded-sm bg-neutral-200"></div><div class="h-4 w-5/6 rounded-sm bg-neutral-200"></div></div><div class="hidden border-l-2 border-neutral-200 lg:col-span-3 lg:block"></div></div>
            <div class="flex justify-end lg:w-3/4"><div class="h-10 w-1/2 rounded-r-md bg-neutral-200"></div></div>
          </div>
        </div>

        <div data-state="load-error" role="alert" class="flex flex-col items-center gap-4 rounded-xl border border-danger-200 bg-danger-50 px-6 py-10 text-center" data-component="ErrorState">
          <span class="inline-flex size-12 items-center justify-center rounded-full bg-neutral-0 text-danger-700"><svg class="size-6 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#triangle-alert"/></svg></span>
          <h3 class="text-lg font-semibold text-fg" data-i18n="student.chat.loadError"></h3>
          <p class="max-w-md text-fg" data-i18n="common.states.errorBody"></p>
          <button type="button" data-goto="default" class="inline-flex min-h-11 items-center justify-center gap-2 rounded-lg border border-border-strong bg-surface-raised px-4 text-sm font-semibold text-fg hover:bg-surface-sunken focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus" data-component="Button" data-variant="secondary"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#refresh-cw"/></svg><span data-i18n="common.actions.retry"></span></button>
        </div>

        <div data-state="default first-use tutor-writing answer citation citation-unavailable no-source low-allowance limit-reached failed corrected tutor-info adapted adapted-basis" role="log" aria-labelledby="conversation-title">
          <ol class="flex flex-col gap-8">

            <!-- Tutor welcome: text on paper, no bubble. -->
            <li data-state="default first-use tutor-writing answer citation citation-unavailable no-source low-allowance limit-reached failed corrected tutor-info adapted adapted-basis" class="grid gap-x-6 lg:grid-cols-12" data-component="ChatMessage" data-variant="tutor-answer">
              <div class="min-w-0 rounded-lg bg-surface px-4 py-4 lg:col-span-9">
                <p class="mb-2 flex flex-wrap items-center gap-2 text-sm font-semibold text-fg-muted"><span data-i18n="student.chat.tutorName"></span><abbr class="rounded-sm border border-info-300 px-1 text-xs font-bold text-info-800 no-underline" data-i18n="student.chat.aiTag" data-i18n-attr="title:student.chat.aiTagLabel"></abbr></p>
                <p class="font-serif text-lg text-fg" data-i18n="student.chat.welcome"></p>
              </div>
            </li>

            <!-- Student: their own line, in pen. -->
            <li data-state="tutor-writing answer citation citation-unavailable no-source low-allowance limit-reached failed corrected tutor-info adapted adapted-basis" class="grid lg:grid-cols-12" data-component="ChatMessage" data-variant="student">
              <div class="flex justify-end lg:col-span-9"><p class="sr-only" data-i18n="student.chat.you"></p><p class="max-w-md rounded-r-md border-l-4 border-primary-600 bg-surface-raised px-4 py-2 text-fg shadow-sm" data-i18n="sample.questions.covered"></p></div>
            </li>

            <li data-state="tutor-writing" data-advance="answer" class="grid lg:grid-cols-12">
              <div role="status" class="flex items-center gap-4 rounded-lg bg-surface px-4 py-4 text-fg-muted lg:col-span-9"><span class="flex gap-1" aria-hidden="true"><span class="size-2 rounded-full bg-neutral-400 motion-safe:animate-bounce"></span><span class="size-2 rounded-full bg-neutral-400 motion-safe:animate-bounce"></span><span class="size-2 rounded-full bg-neutral-400 motion-safe:animate-bounce"></span></span><span data-i18n="student.chat.writing"></span></div>
            </li>

            <!-- Tutor answer: the text in Literata, its sources in the margin past the green rule. -->
            <li data-state="answer citation citation-unavailable no-source low-allowance limit-reached failed corrected tutor-info adapted adapted-basis" class="grid gap-x-6 lg:grid-cols-12" data-component="ChatMessage" data-variant="tutor-answer">
              <div class="min-w-0 rounded-lg bg-surface px-4 py-4 lg:col-span-9">
                <p class="mb-2 flex flex-wrap items-center gap-2 text-sm font-semibold text-fg-muted"><span data-i18n="student.chat.tutorName"></span><abbr class="rounded-sm border border-info-300 px-1 text-xs font-bold text-info-800 no-underline" data-i18n="student.chat.aiTag" data-i18n-attr="title:student.chat.aiTagLabel"></abbr><span data-state="adapted adapted-basis"><button type="button" data-goto="adapted-basis" aria-haspopup="dialog" class="inline-flex min-h-11 items-center gap-1 rounded-md border border-primary-300 bg-primary-50 px-2 text-xs font-semibold text-primary-800 hover:bg-primary-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus md:min-h-8" data-component="AdaptedBadge" data-variant="interactive"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#sparkles"/></svg><span data-i18n="student.chat.adapted.badge"></span></button></span></p>
                <div data-state="adapted adapted-basis"><p class="mb-4 flex items-start gap-2 text-sm text-fg" data-component="DecisionReason" data-variant="inline"><svg class="mt-0.5 size-4 shrink-0 text-info-700" aria-hidden="true"><use href="../assets/img/icons.svg#info"/></svg><span data-i18n="sample.adaptation.reason"></span></p></div>
                <div class="flex flex-col gap-4 font-serif text-lg text-fg">
                  <p data-i18n="sample.chat.answerIntro"></p>
                  <ol class="flex list-decimal flex-col gap-4 pl-6 marker:font-sans marker:font-semibold marker:text-fg-muted">
                    <li><span data-i18n="sample.chat.step1"></span><sup class="ml-1 font-sans text-xs font-bold text-teacher-700" aria-hidden="true">1</sup><span class="bg-grid mt-2 block rounded-md border border-border px-4 py-2 italic break-words" data-i18n="sample.chat.eq1"></span></li>
                    <li><span data-i18n="sample.chat.step2"></span><span class="bg-grid mt-2 block rounded-md border border-border px-4 py-2 italic break-words" data-i18n="sample.chat.eq2"></span></li>
                    <li><span data-i18n="sample.chat.check"></span><span class="bg-grid mt-2 block rounded-md border border-border px-4 py-2 italic break-words" data-i18n="sample.chat.eq3"></span></li>
                  </ol>
                  <p data-i18n="sample.chat.tip"></p>
                </div>
              </div>
              <aside class="mx-4 mt-2 flex flex-col gap-2 border-t-2 border-margin bg-surface pt-2 lg:mx-0 lg:mt-0 lg:border-t-0 lg:border-l-2 lg:pt-4 lg:pl-4 lg:col-span-3" data-i18n-attr="aria-label:student.chat.sources">
                <p class="text-xs font-bold text-teacher-700" data-i18n="student.chat.sources"></p>
                <span data-state="answer citation no-source low-allowance limit-reached failed corrected tutor-info adapted adapted-basis"><button type="button" data-goto="citation" class="-mx-2 flex w-full flex-col items-start gap-1 rounded-md px-2 py-2 text-left hover:bg-teacher-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus" data-component="SourceCitation" data-variant="margin-note" data-i18n-attr="aria-label:student.chat.citation.chipLabel" data-i18n-vars='{"doc": "sample.documents.tema3Short", "loc": "sample.chat.loc"}'><span class="flex items-baseline gap-1 text-sm font-semibold text-teacher-700"><sup class="text-xs font-bold" aria-hidden="true">1</sup><span data-i18n="student.chat.citation.chip" data-i18n-vars='{"doc": "sample.documents.tema3Short", "loc": "sample.chat.loc"}'></span></span><span class="line-clamp-4 font-serif text-sm text-fg-muted italic" data-i18n="sample.chat.passage"></span><span class="text-sm font-semibold text-teacher-700 underline decoration-teacher-300 underline-offset-2" data-i18n="student.chat.citation.open"></span></button></span>
                <span data-state="citation-unavailable"><button type="button" disabled class="flex w-full flex-col items-start gap-1 rounded-md border border-dashed border-border-strong px-2 py-2 text-left text-sm text-fg-muted" data-component="SourceCitation" data-variant="unavailable"><span class="flex items-center gap-1"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#file-text"/></svg><span data-i18n="student.chat.citation.unavailable"></span></span></button></span>
              </aside>
            </li>

            <li data-state="no-source limit-reached" class="grid lg:grid-cols-12" data-component="ChatMessage" data-variant="student">
              <div class="flex justify-end lg:col-span-9"><p class="sr-only" data-i18n="student.chat.you"></p><p class="max-w-md rounded-r-md border-l-4 border-primary-600 bg-surface-raised px-4 py-2 text-fg shadow-sm" data-i18n="sample.questions.notCovered"></p></div>
            </li>

            <!-- Not covered: no citations; the margin stays empty behind a dashed rule. -->
            <li data-state="no-source limit-reached" class="grid gap-x-6 lg:grid-cols-12" data-component="ChatMessage" data-variant="tutor-no-source">
              <div class="min-w-0 rounded-lg border border-info-200 bg-info-50 px-4 py-4 lg:col-span-9" data-component="NoSourceNotice">
                <p class="mb-2 flex flex-wrap items-center gap-2 text-sm font-semibold text-fg-muted"><span data-i18n="student.chat.tutorName"></span><abbr class="rounded-sm border border-info-300 px-1 text-xs font-bold text-info-800 no-underline" data-i18n="student.chat.aiTag" data-i18n-attr="title:student.chat.aiTagLabel"></abbr></p>
                <div class="flex gap-4">
                  <svg role="img" class="mt-1 size-6 shrink-0 text-info-700" data-i18n-attr="aria-label:student.chat.noSource.iconLabel"><use href="../assets/img/icons.svg#info"/></svg>
                  <div class="flex flex-col gap-2">
                    <h3 class="text-lg font-semibold text-fg" data-i18n="student.chat.noSource.heading"></h3>
                    <p class="font-serif text-fg" data-i18n="student.chat.noSource.body"></p>
                    <div class="mt-2 flex flex-wrap gap-2">
                      <button type="button" data-focus="#chat-input" class="inline-flex min-h-11 items-center justify-center gap-2 rounded-lg border border-border-strong bg-surface-raised px-4 text-sm font-semibold text-fg hover:bg-surface-sunken focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus md:min-h-9" data-component="Button" data-variant="secondary"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#refresh-cw"/></svg><span data-i18n="student.chat.noSource.rephrase"></span></button>
                      <a href="mailto:elena.ruiz@example.org" class="inline-flex min-h-11 items-center justify-center gap-2 rounded-lg border border-border-strong bg-surface-raised px-4 text-sm font-semibold text-fg hover:bg-surface-sunken focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus md:min-h-9" data-component="Button" data-variant="secondary"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#message-circle"/></svg><span data-i18n="student.chat.noSource.askTeacher"></span></a>
                    </div>
                  </div>
                </div>
              </div>
              <div class="hidden border-l-2 border-dashed border-border-strong lg:col-span-3 lg:block" aria-hidden="true"></div>
            </li>

            <li data-state="failed" class="grid lg:grid-cols-12" data-component="ChatMessage" data-variant="failed">
              <div class="flex flex-col items-end gap-2 lg:col-span-9">
                <p class="max-w-md rounded-r-md border-l-4 border-danger-600 bg-surface-raised px-4 py-2 text-fg shadow-sm" data-i18n="sample.chat.failedQuestion"></p>
                <div class="flex max-w-md flex-col items-end gap-2 rounded-md bg-surface px-2 py-1 text-right text-sm">
                  <p class="flex items-center gap-2 font-semibold text-danger-700"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#triangle-alert"/></svg><span data-i18n="student.chat.failed.title"></span></p>
                  <p class="text-fg-muted" data-i18n="student.chat.failed.body"></p>
                  <button type="button" data-goto="tutor-writing" class="inline-flex min-h-11 items-center justify-center gap-2 rounded-lg border border-border-strong bg-surface-raised px-4 text-sm font-semibold text-fg hover:bg-surface-sunken focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus md:min-h-9" data-component="Button" data-variant="secondary"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#refresh-cw"/></svg><span data-i18n="common.actions.retry"></span></button>
                </div>
              </div>
            </li>

            <li data-state="corrected" class="grid lg:grid-cols-12" data-component="ChatMessage" data-variant="student">
              <div class="flex justify-end lg:col-span-9"><p class="sr-only" data-i18n="student.chat.you"></p><p class="max-w-md rounded-r-md border-l-4 border-primary-600 bg-surface-raised px-4 py-2 text-fg shadow-sm" data-i18n="sample.corrections.chatQuestion"></p></div>
            </li>

            <!-- Corrected answer: the teacher's correction is written in the margin, in green ink. -->
            <li data-state="corrected" class="grid gap-x-6 lg:grid-cols-12" data-component="ChatMessage" data-variant="tutor-answer">
              <div class="min-w-0 rounded-lg bg-surface px-4 py-4 lg:col-span-9">
                <p class="mb-2 flex flex-wrap items-center gap-2 text-sm font-semibold text-fg-muted"><span data-i18n="student.chat.tutorName"></span><abbr class="rounded-sm border border-info-300 px-1 text-xs font-bold text-info-800 no-underline" data-i18n="student.chat.aiTag" data-i18n-attr="title:student.chat.aiTagLabel"></abbr><span class="inline-flex items-center gap-1 rounded-sm border border-teacher-300 bg-teacher-50 px-2 py-0.5 text-xs font-semibold text-teacher-800"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#flag"/></svg><span data-i18n="common.correction.correctedTag"></span></span></p>
                <p class="font-serif text-lg text-fg-muted line-through decoration-teacher-600 decoration-1" data-i18n="sample.corrections.chatWrong"></p>
              </div>
              <div class="mx-4 mt-2 flex flex-col gap-1 border-t-2 border-margin bg-surface pt-2 lg:mx-0 lg:mt-0 lg:border-t-0 lg:border-l-2 lg:pt-4 lg:pl-4 lg:col-span-3" data-component="TeacherCorrection" data-variant="student">
                <p class="flex items-center gap-2 text-sm font-semibold text-teacher-700"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#graduation-cap"/></svg><span data-i18n="common.correction.reviewed"></span></p>
                <p class="text-xs text-fg-muted tabular-nums" data-i18n="common.correction.date" data-i18n-vars='{"date": "date:2026-10-10"}'></p>
                <p class="mt-1 font-serif text-fg" data-i18n="sample.corrections.chat"></p>
              </div>
            </li>
          </ol>
        </div>

        <div data-state="default first-use" class="flex flex-col gap-2 lg:w-3/4">
          <p class="w-fit rounded-sm bg-surface px-1 text-sm text-fg-muted" data-i18n="student.chat.suggestionsTitle"></p>
          <div class="flex flex-wrap gap-2">
            <button type="button" data-goto="tutor-writing" class="inline-flex min-h-11 items-center rounded-lg border border-border-strong bg-surface-raised px-4 text-left text-sm text-fg hover:border-primary-600 hover:bg-surface-sunken focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus" data-i18n="sample.questions.covered"></button>
            <button type="button" data-goto="no-source" class="inline-flex min-h-11 items-center rounded-lg border border-border-strong bg-surface-raised px-4 text-left text-sm text-fg hover:border-primary-600 hover:bg-surface-sunken focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus" data-i18n="sample.questions.notCovered"></button>
          </div>
        </div>
        <div data-state="answer corrected tutor-info adapted adapted-basis" class="flex flex-col gap-2 lg:w-3/4">
          <p class="w-fit rounded-sm bg-surface px-1 text-sm text-fg-muted" data-i18n="student.chat.followUp"></p>
          <div class="flex flex-wrap gap-2">
            <button type="button" data-goto="no-source" class="inline-flex min-h-11 items-center rounded-lg border border-border-strong bg-surface-raised px-4 text-left text-sm text-fg hover:border-primary-600 hover:bg-surface-sunken focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus" data-i18n="sample.questions.notCovered"></button>
          </div>
        </div>
      </section>

      <!-- Composer: sits above the phone tab bar. -->
      <div class="bottom-tabbar sticky z-30 -mx-4 flex flex-col gap-2 border-t border-border bg-surface px-4 pt-2 pb-4 sm:-mx-6 sm:px-6 lg:mx-0 lg:border-t-0 lg:px-0">
        <p data-state="default tutor-writing answer citation citation-unavailable no-source failed corrected tutor-info adapted adapted-basis" class="flex items-center gap-2 text-sm text-fg-muted" data-component="MessageAllowance" data-variant="normal"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#message-circle"/></svg><span class="tabular-nums" data-i18n="student.chat.remaining" data-i18n-count="12"></span></p>
        <p data-state="first-use" class="flex items-center gap-2 text-sm text-fg-muted" data-component="MessageAllowance" data-variant="normal"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#message-circle"/></svg><span class="tabular-nums" data-i18n="student.chat.remaining" data-i18n-count="30"></span></p>
        <p data-state="low-allowance" class="flex items-start gap-2 rounded-md bg-warning-200 px-4 py-2 text-sm text-warning-900" data-component="MessageAllowance" data-variant="low"><svg class="mt-0.5 size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#triangle-alert"/></svg><span><strong class="font-semibold tabular-nums" data-i18n="student.chat.remaining" data-i18n-count="3"></strong> <span data-i18n="student.chat.lowWarning" data-i18n-vars='{"time": "00:00"}'></span></span></p>
        <section data-state="limit-reached" aria-labelledby="limit-title" class="rounded-xl border border-warning-300 bg-warning-50 p-4" data-component="LimitReachedBanner" data-variant="chat"><div class="flex gap-4"><svg class="mt-1 size-6 shrink-0 text-warning-800" aria-hidden="true"><use href="../assets/img/icons.svg#clock"/></svg><div class="min-w-0 flex-1"><h2 id="limit-title" class="font-semibold text-fg tabular-nums" data-i18n="student.chat.limit.title" data-i18n-vars='{"limit": "number:30"}'></h2><p class="mt-1 text-fg" data-i18n="student.chat.limit.body" data-i18n-vars='{"time": "00:00"}'></p><div class="mt-4 rounded-lg border border-warning-200 bg-surface-raised p-4"><p class="text-xs font-semibold text-fg-muted" data-i18n="student.chat.limit.draftLabel"></p><p class="mt-1 text-fg" data-i18n="sample.chat.draft"></p></div></div></div></section>
        <form data-state="default first-use tutor-writing answer citation citation-unavailable no-source low-allowance failed loading corrected tutor-info adapted adapted-basis" class="flex items-end gap-2 rounded-lg border border-border-strong bg-surface-raised p-2 shadow-sm focus-within:outline-2 focus-within:outline-offset-2 focus-within:outline-focus" data-component="ChatComposer" data-variant="default" onsubmit="return false"><label for="chat-input" class="sr-only" data-i18n="student.chat.composer.label"></label><textarea id="chat-input" rows="2" class="min-h-11 flex-1 resize-none bg-transparent px-2 py-2 text-base text-fg placeholder:text-fg-muted focus-visible:outline-none disabled:cursor-not-allowed" data-i18n-attr="placeholder:student.chat.composer.placeholder"></textarea><button type="button" data-state="default first-use tutor-writing answer citation citation-unavailable no-source failed corrected tutor-info adapted adapted-basis" data-goto="tutor-writing" class="inline-flex size-11 shrink-0 items-center justify-center rounded-lg bg-primary-600 text-fg-inverse hover:bg-primary-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus disabled:cursor-not-allowed disabled:bg-neutral-200 disabled:text-neutral-600" data-i18n-attr="aria-label:common.actions.send"><svg class="size-5 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#send"/></svg></button><button type="button" data-state="low-allowance" data-goto="limit-reached" class="inline-flex size-11 shrink-0 items-center justify-center rounded-lg bg-primary-600 text-fg-inverse hover:bg-primary-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus disabled:cursor-not-allowed disabled:bg-neutral-200 disabled:text-neutral-600" data-i18n-attr="aria-label:common.actions.send"><svg class="size-5 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#send"/></svg></button><button type="button" data-state="loading" disabled class="inline-flex size-11 shrink-0 items-center justify-center rounded-lg bg-primary-600 text-fg-inverse hover:bg-primary-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus disabled:cursor-not-allowed disabled:bg-neutral-200 disabled:text-neutral-600" data-i18n-attr="aria-label:common.actions.send"><svg class="size-5 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#send"/></svg></button></form>
      </div>

      <dialog data-modal data-dismissible="false" data-state="first-use" data-close-state="default" aria-labelledby="disclosure-title" class="m-auto w-full max-w-lg rounded-2xl border border-border bg-surface-raised p-0 text-fg shadow-lg backdrop:bg-scrim/60" data-component="AIDisclosure" data-variant="first-use"><form method="dialog" class="flex flex-col"><div class="flex flex-col gap-6 p-6"><h2 id="disclosure-title" class="text-2xl font-semibold" data-i18n="student.chat.disclosure.title"></h2><ul class="flex flex-col gap-4"><li class="flex gap-4"><span class="inline-flex size-9 shrink-0 items-center justify-center rounded-full border border-border-strong text-fg"><svg class="size-5 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#sparkles"/></svg></span><span class="pt-2 text-fg" data-i18n="student.chat.disclosure.ai"></span></li><li class="flex gap-4"><span class="inline-flex size-9 shrink-0 items-center justify-center rounded-full border border-teacher-600 text-teacher-700"><svg class="size-5 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#book-open"/></svg></span><span class="pt-2 text-fg" data-i18n="student.chat.disclosure.material"></span></li><li class="flex gap-4"><span class="inline-flex size-9 shrink-0 items-center justify-center rounded-full border border-teacher-600 text-teacher-700"><svg class="size-5 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#eye"/></svg></span><span class="pt-2 text-fg" data-i18n="student.chat.disclosure.review"></span></li><li class="flex gap-4"><span class="inline-flex size-9 shrink-0 items-center justify-center rounded-full border border-border-strong text-fg"><svg class="size-5 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#message-circle"/></svg></span><span class="pt-2 text-fg tabular-nums" data-i18n="student.chat.disclosure.limit" data-i18n-vars='{"limit": "number:30"}'></span></li></ul><label class="flex cursor-pointer items-start gap-4 rounded-lg border border-border-strong p-4 hover:bg-surface-sunken has-checked:border-neutral-900 has-checked:bg-surface-sunken has-checked:ring-1 has-checked:ring-neutral-900"><input type="checkbox" required class="mt-1 size-5 shrink-0 accent-primary-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus" /><span class="text-fg" data-i18n="student.chat.disclosure.ack"></span></label></div><div class="flex justify-end border-t border-border p-4"><button type="submit" class="inline-flex min-h-11 items-center justify-center gap-2 rounded-lg bg-primary-600 px-4 text-sm font-semibold text-fg-inverse hover:bg-primary-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus" data-component="Button" data-variant="primary"><span data-i18n="student.chat.disclosure.start"></span></button></div></form></dialog>

      <dialog data-modal data-state="citation" data-close-state="answer" aria-labelledby="sheet-title" class="mx-0 mt-auto mb-0 max-h-dvh w-full max-w-none overflow-y-auto rounded-t-2xl border border-border bg-surface-raised p-0 text-fg shadow-lg backdrop:bg-scrim/50 lg:my-0 lg:mr-0 lg:ml-auto lg:h-dvh lg:max-h-none lg:w-md lg:max-w-md lg:rounded-none lg:rounded-l-2xl" data-component="CitationSheet"><span class="mx-auto mt-2 block h-1.5 w-10 rounded-full bg-neutral-300 lg:hidden" aria-hidden="true"></span><div class="flex items-center justify-between gap-4 border-b border-border px-6 py-4"><h2 id="sheet-title" class="text-xl font-semibold" data-i18n="student.chat.citation.sheetTitle"></h2><form method="dialog"><button type="submit" class="inline-flex size-11 items-center justify-center rounded-lg text-fg-muted hover:bg-surface-sunken hover:text-fg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus" data-i18n-attr="aria-label:common.actions.close" data-component="IconButton"><svg class="size-5 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#x"/></svg></button></form></div><div class="flex flex-col gap-6 p-6"><div class="flex items-start gap-4"><span class="inline-flex size-10 shrink-0 items-center justify-center rounded-lg border border-teacher-600 text-teacher-700"><svg class="size-5 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#file-text"/></svg></span><div class="min-w-0"><p class="font-semibold break-words text-fg" data-i18n="sample.documents.tema3"></p><p class="text-sm text-fg-muted" data-i18n="sample.chat.loc"></p></div></div><figure class="flex flex-col gap-2"><figcaption class="text-sm font-semibold text-teacher-700" data-i18n="student.chat.citation.passageLabel"></figcaption><blockquote class="border-l-2 border-margin bg-surface py-2 pr-2 pl-4 font-serif text-lg text-fg" data-i18n="sample.chat.passage"></blockquote></figure><p class="flex items-center gap-2 text-sm text-teacher-700"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#check"/></svg><span data-i18n="student.chat.citation.validated"></span></p></div></dialog>

      <dialog data-modal data-state="adapted-basis" data-close-state="adapted" aria-labelledby="adapt-title" class="mx-0 mt-auto mb-0 max-h-dvh w-full max-w-none overflow-y-auto rounded-t-2xl border border-border bg-surface-raised p-0 text-fg shadow-lg backdrop:bg-scrim/50 lg:my-0 lg:mr-0 lg:ml-auto lg:h-dvh lg:max-h-none lg:w-md lg:max-w-md lg:rounded-none lg:rounded-l-2xl" data-component="AdaptationSheet"><span class="mx-auto mt-2 block h-1.5 w-10 rounded-full bg-neutral-300 lg:hidden" aria-hidden="true"></span><div class="flex items-center justify-between gap-4 border-b border-border px-6 py-4"><h2 id="adapt-title" class="text-xl font-semibold" data-i18n="student.chat.adapted.sheetTitle"></h2><form method="dialog"><button type="submit" class="inline-flex size-11 items-center justify-center rounded-lg text-fg-muted hover:bg-surface-sunken hover:text-fg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus" data-i18n-attr="aria-label:common.actions.close" data-component="IconButton"><svg class="size-5 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#x"/></svg></button></form></div><div class="flex flex-col gap-4 p-6"><p class="text-fg" data-i18n="student.chat.adapted.lead"></p><ul class="flex flex-col gap-2"><li class="flex flex-col gap-1 rounded-lg border border-border bg-surface p-4"><p class="font-medium text-fg" data-i18n="sample.patterns.transpose"></p><p class="text-sm text-fg-muted"><span class="tabular-nums" data-i18n="student.chat.adapted.entry" data-i18n-vars='{"count": "number:3"}'></span>, <span data-i18n="sample.topics.linear"></span></p></li></ul><a href="progress.html" class="w-fit rounded-sm font-semibold text-fg underline decoration-neutral-400 underline-offset-2 hover:decoration-fg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus" data-i18n="student.chat.adapted.progress"></a><p class="flex items-center gap-2 text-sm text-teacher-700"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#graduation-cap"/></svg><span data-i18n="student.chat.adapted.teacherSees"></span></p></div></dialog>

      <dialog data-modal data-state="tutor-info" data-close-state="@back" aria-labelledby="tutor-info-title" class="m-auto w-full max-w-md rounded-2xl border border-border bg-surface-raised p-0 text-fg shadow-lg backdrop:bg-scrim/50" data-component="Dialog"><div class="flex flex-col gap-4 p-6"><h2 class="text-xl font-semibold" data-i18n="student.chat.tutorInfo.title" id="tutor-info-title"></h2><p class="text-fg-muted" data-i18n="student.chat.tutorInfo.lead"></p><dl class="flex flex-col gap-2 border-l-2 border-margin pl-4"><div class="flex flex-wrap gap-x-2"><dt class="font-semibold text-teacher-700" data-i18n="student.chat.tutorInfo.levelLabel"></dt><dd class="text-fg" data-i18n="student.chat.tutorInfo.level"></dd></div><div class="flex flex-wrap gap-x-2"><dt class="font-semibold text-teacher-700" data-i18n="student.chat.tutorInfo.toneLabel"></dt><dd class="text-fg" data-i18n="student.chat.tutorInfo.tone"></dd></div><div class="flex flex-wrap gap-x-2"><dt class="font-semibold text-teacher-700" data-i18n="student.chat.tutorInfo.policyLabel"></dt><dd class="text-fg" data-i18n="student.chat.tutorInfo.policy"></dd></div></dl></div><div class="flex flex-col-reverse gap-2 border-t border-border p-4 sm:flex-row sm:justify-end"><form method="dialog" class="contents"><button type="submit" class="inline-flex min-h-11 items-center justify-center gap-2 rounded-lg bg-primary-600 px-4 text-sm font-semibold text-fg-inverse hover:bg-primary-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus" data-component="Button" data-variant="primary"><span data-i18n="student.chat.tutorInfo.ok"></span></button></form></div></dialog>
    </main>
    <div data-include="partials/footer.html"></div>

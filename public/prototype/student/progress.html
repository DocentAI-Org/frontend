<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mi progreso · DocentAI (prototipo)</title>
    <style>
      :root { color-scheme: light dark; }
      [data-cloak] { visibility: hidden; }
      [data-cloak] *, [data-cloak] *::before, [data-cloak] *::after { transition: none !important; }
      summary::-webkit-details-marker { display: none; }
    </style>
    <script type="module" src="../assets/js/prototype.js"></script>
  </head>
  <body data-cloak class="flex min-h-dvh flex-col bg-surface font-sans text-fg antialiased">
    <a href="#main" class="sr-only rounded-lg bg-primary-700 px-4 py-2 text-fg-inverse focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-50" data-i18n="common.a11y.skipToContent"></a>
    <div data-include="partials/shell-student.html"></div>
    <main id="main" tabindex="-1" class="mx-auto w-full max-w-6xl flex-1 px-4 py-6 sm:px-6 lg:py-10">
      <div class="mx-auto flex w-full max-w-3xl flex-col gap-6">
        <div class="flex flex-col gap-4 pb-2 sm:flex-row sm:items-end sm:justify-between sm:pb-4"><div class="min-w-0"><h1 class="text-3xl font-bold text-fg sm:text-4xl" data-i18n="student.progress.title"></h1><p class="mt-1 text-sm font-medium text-fg-muted" data-i18n="sample.course.name"></p><p class="mt-2 max-w-3xl text-fg-muted" data-i18n="student.progress.lead"></p></div></div>
        <div data-state="loading" class="rounded-xl border border-border bg-surface-raised p-6" data-component="Skeleton"><p role="status" class="sr-only" data-i18n="common.states.loading"></p><div class="flex flex-col gap-4 motion-safe:animate-pulse" aria-hidden="true"><div class="w-1/3 h-6 rounded-md bg-neutral-200"></div><div class="w-full h-4 rounded-md bg-neutral-200"></div><div class="w-5/6 h-4 rounded-md bg-neutral-200"></div><div class="w-full h-20 rounded-md bg-neutral-200"></div><div class="w-2/3 h-4 rounded-md bg-neutral-200"></div></div></div>
        <div data-state="error" role="alert" class="flex flex-col items-center gap-4 rounded-xl border border-danger-200 bg-danger-50 px-6 py-12 text-center" data-component="ErrorState"><span class="inline-flex size-12 items-center justify-center rounded-full bg-neutral-0 text-danger-700"><svg class="size-6 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#triangle-alert"/></svg></span><h2 class="text-lg font-bold text-fg" data-i18n="student.progress.loadError"></h2><p class="max-w-md text-fg" data-i18n="common.states.errorBody"></p><button type="button" data-goto="default" class="inline-flex items-center justify-center gap-2 rounded-lg font-semibold motion-safe:transition-colors motion-safe:duration-150 motion-safe:ease-standard focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus disabled:cursor-not-allowed disabled:border-transparent disabled:bg-neutral-200 disabled:text-neutral-600 disabled:shadow-none min-h-11 px-4 text-sm border border-border-strong bg-surface-raised text-fg hover:bg-surface-sunken" data-component="Button" data-variant="secondary"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#refresh-cw"/></svg><span data-i18n="common.actions.retry"></span></button></div>
        <div data-state="empty" class="flex flex-col items-center gap-4 rounded-xl border border-dashed border-border-strong bg-surface-raised px-6 py-12 text-center" data-component="EmptyState"><span class="inline-flex size-12 items-center justify-center rounded-full bg-surface-sunken text-fg"><svg class="size-6 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#chart-column"/></svg></span><h2 class="text-lg font-bold text-fg" data-i18n="student.progress.emptyTitle"></h2><p class="max-w-md text-fg-muted" data-i18n="student.progress.emptyBody"></p><div class="flex flex-wrap justify-center gap-2"><a href="chat.html" class="inline-flex items-center justify-center gap-2 rounded-lg font-semibold motion-safe:transition-colors motion-safe:duration-150 motion-safe:ease-standard focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus disabled:cursor-not-allowed disabled:border-transparent disabled:bg-neutral-200 disabled:text-neutral-600 disabled:shadow-none min-h-11 px-4 text-sm bg-primary-600 text-fg-inverse hover:bg-primary-700" data-component="Button" data-variant="primary"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#message-circle"/></svg><span data-i18n="student.progress.ask"></span></a><a href="quiz.html" class="inline-flex items-center justify-center gap-2 rounded-lg font-semibold motion-safe:transition-colors motion-safe:duration-150 motion-safe:ease-standard focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus disabled:cursor-not-allowed disabled:border-transparent disabled:bg-neutral-200 disabled:text-neutral-600 disabled:shadow-none min-h-11 px-4 text-sm border border-border-strong bg-surface-raised text-fg hover:bg-surface-sunken" data-component="Button" data-variant="secondary"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#lightbulb"/></svg><span data-i18n="student.progress.quiz"></span></a></div></div>
        <ul data-state="default" class="grid gap-4 sm:grid-cols-2" data-i18n-attr="aria-label:student.progress.listLabel"><li class="rounded-xl border border-border bg-surface-raised flex flex-col gap-4 p-6" data-component="ProgressByTopic"><div class="flex flex-wrap items-baseline justify-between gap-2"><h2 class="font-bold text-fg" data-i18n="sample.topics.linear" id="pt-linear"></h2><span class="text-sm font-semibold text-fg tabular-nums" data-i18n="student.progress.percent" data-i18n-vars='{"value": "percent:0.6"}'></span></div><div role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="60" aria-labelledby="pt-linear" aria-describedby="pb-linear" class="h-3 rounded-full bg-surface-sunken"><span class="block h-3 w-3/5 rounded-full bg-success-600"></span></div><p class="text-sm text-fg-muted"><span class="tabular-nums" data-i18n="student.progress.basis" data-i18n-vars='{"right": "number:6", "total": "number:10"}' id="pb-linear"></span> · <span class="tabular-nums" data-i18n="student.progress.quizzes" data-i18n-count="2"></span></p></li><li class="rounded-xl border border-border bg-surface-raised flex flex-col gap-4 p-6" data-component="ProgressByTopic"><div class="flex flex-wrap items-baseline justify-between gap-2"><h2 class="font-bold text-fg" data-i18n="sample.topics.systems" id="pt-systems"></h2><span class="text-sm font-semibold text-fg tabular-nums" data-i18n="student.progress.percent" data-i18n-vars='{"value": "percent:0.75"}'></span></div><div role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="75" aria-labelledby="pt-systems" aria-describedby="pb-systems" class="h-3 rounded-full bg-surface-sunken"><span class="block h-3 w-3/4 rounded-full bg-success-600"></span></div><p class="text-sm text-fg-muted"><span class="tabular-nums" data-i18n="student.progress.basis" data-i18n-vars='{"right": "number:3", "total": "number:4"}' id="pb-systems"></span> · <span class="tabular-nums" data-i18n="student.progress.quizzes" data-i18n-count="1"></span></p></li><li class="rounded-xl border border-border bg-surface-raised flex flex-col gap-4 p-6" data-component="ProgressByTopic"><div class="flex flex-wrap items-baseline justify-between gap-2"><h2 class="font-bold text-fg" data-i18n="sample.topics.polynomials" id="pt-polynomials"></h2><span class="text-sm font-semibold text-fg tabular-nums" data-i18n="student.progress.percent" data-i18n-vars='{"value": "percent:0.2"}'></span></div><div role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="20" aria-labelledby="pt-polynomials" aria-describedby="pb-polynomials" class="h-3 rounded-full bg-surface-sunken"><span class="block h-3 w-1/5 rounded-full bg-success-600"></span></div><p class="text-sm text-fg-muted"><span class="tabular-nums" data-i18n="student.progress.basis" data-i18n-vars='{"right": "number:1", "total": "number:5"}' id="pb-polynomials"></span> · <span class="tabular-nums" data-i18n="student.progress.quizzes" data-i18n-count="0"></span></p></li><li class="rounded-xl border border-border bg-surface-raised flex flex-col gap-4 p-6" data-component="ProgressByTopic"><div class="flex flex-wrap items-baseline justify-between gap-2"><h2 class="font-bold text-fg" data-i18n="sample.topics.factorisation" id="pt-factorisation"></h2><span class="text-sm font-semibold text-fg tabular-nums" data-i18n="student.progress.percent" data-i18n-vars='{"value": "percent:0.0"}'></span></div><div role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-labelledby="pt-factorisation" aria-describedby="pb-factorisation" class="h-3 rounded-full bg-surface-sunken"><span class="block h-3 w-0 rounded-full bg-success-600"></span></div><p class="text-sm text-fg-muted"><span data-i18n="student.progress.notStarted" id="pb-factorisation"></span></p></li></ul>
      </div>
    </main>
    <div data-include="partials/footer.html"></div>
  </body>
</html>

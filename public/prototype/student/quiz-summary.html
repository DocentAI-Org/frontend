<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Resumen del cuestionario · DocentAI (prototipo)</title>
    <style>
      :root { color-scheme: light dark; }
      [data-cloak] { visibility: hidden; }
      [data-cloak] *, [data-cloak] *::before, [data-cloak] *::after { transition: none !important; }
      summary::-webkit-details-marker { display: none; }
    </style>
    <script type="module" src="../assets/js/prototype.js"></script>
  </head>
  <body data-cloak class="flex min-h-dvh flex-col bg-surface font-sans text-fg antialiased">
    <a href="#main" class="sr-only rounded-lg bg-primary-700 px-4 py-2 text-fg-inverse focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-50" data-i18n="common.a11y.skipToContent"></a>
    <div data-include="partials/shell-student.html"></div>
    <main id="main" tabindex="-1" class="mx-auto w-full max-w-6xl flex-1 px-4 py-6 sm:px-6 lg:py-10">
      <div class="mx-auto flex w-full max-w-3xl flex-col gap-6">
        <div class="flex flex-col gap-4 pb-2 sm:flex-row sm:items-end sm:justify-between sm:pb-4"><div class="min-w-0"><h1 class="text-3xl font-bold text-fg sm:text-4xl" data-i18n="student.quiz.summaryTitle"></h1><p class="mt-1 text-sm font-medium text-fg-muted" data-i18n="sample.course.name"></p></div></div>
        <div data-state="loading" class="rounded-xl border border-border bg-surface-raised p-6" data-component="Skeleton"><p role="status" class="sr-only" data-i18n="common.states.loading"></p><div class="flex flex-col gap-4 motion-safe:animate-pulse" aria-hidden="true"><div class="w-1/3 h-6 rounded-md bg-neutral-200"></div><div class="w-full h-4 rounded-md bg-neutral-200"></div><div class="w-5/6 h-4 rounded-md bg-neutral-200"></div><div class="w-full h-20 rounded-md bg-neutral-200"></div><div class="w-2/3 h-4 rounded-md bg-neutral-200"></div></div></div>
        <div data-state="error" role="alert" class="flex flex-col items-center gap-4 rounded-xl border border-danger-200 bg-danger-50 px-6 py-12 text-center" data-component="ErrorState"><span class="inline-flex size-12 items-center justify-center rounded-full bg-neutral-0 text-danger-700"><svg class="size-6 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#triangle-alert"/></svg></span><h2 class="text-lg font-bold text-fg" data-i18n="student.quiz.summaryLoadError"></h2><p class="max-w-md text-fg" data-i18n="common.states.errorBody"></p><button type="button" data-goto="default" class="inline-flex items-center justify-center gap-2 rounded-lg font-semibold motion-safe:transition-colors motion-safe:duration-150 motion-safe:ease-standard focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus disabled:cursor-not-allowed disabled:border-transparent disabled:bg-neutral-200 disabled:text-neutral-600 disabled:shadow-none min-h-11 px-4 text-sm border border-border-strong bg-surface-raised text-fg hover:bg-surface-sunken" data-component="Button" data-variant="secondary"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#refresh-cw"/></svg><span data-i18n="common.actions.retry"></span></button></div>
        <div data-state="default" class="flex flex-col gap-6">
          <section class="rounded-xl border border-border bg-surface-raised flex flex-col items-center gap-2 px-6 py-10 text-center" data-celebrate>
            <span class="relative inline-flex size-14 items-center justify-center rounded-full bg-primary-600 text-fg-inverse" data-celebrate-badge><svg class="size-7 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#check"/></svg></span>
            <p class="mt-2 text-lg font-bold text-fg" data-celebrate-text data-i18n="student.quiz.celebrate"></p>
            <p class="text-4xl font-bold text-fg tabular-nums sm:text-5xl" data-i18n="student.quiz.score" data-i18n-vars='{"right": "number:4", "total": "number:5"}'></p>
            <p class="text-fg-muted" data-celebrate-text data-i18n="student.quiz.celebrateBody"></p>
          </section>
          <section aria-labelledby="topics-title" class="rounded-xl border border-border bg-surface-raised flex flex-col gap-4 p-6"><h2 class="text-lg font-bold text-fg" data-i18n="student.quiz.byTopic" id="topics-title"></h2><ul class="flex flex-col gap-4"><li class="flex flex-col gap-2"><div class="flex flex-wrap items-baseline justify-between gap-2"><span class="font-medium text-fg" data-i18n="sample.topics.linear"></span><span class="text-sm font-semibold text-fg tabular-nums" data-i18n="student.quiz.score" data-i18n-vars='{"right": "number:3", "total": "number:4"}'></span></div><span class="h-3 rounded-full bg-surface-sunken" aria-hidden="true"><span class="block h-3 w-3/4 rounded-full bg-success-600"></span></span></li><li class="flex flex-col gap-2"><div class="flex flex-wrap items-baseline justify-between gap-2"><span class="font-medium text-fg" data-i18n="sample.topics.systems"></span><span class="text-sm font-semibold text-fg tabular-nums" data-i18n="student.quiz.score" data-i18n-vars='{"right": "number:1", "total": "number:1"}'></span></div><span class="h-3 rounded-full bg-surface-sunken" aria-hidden="true"><span class="block h-3 w-full rounded-full bg-success-600"></span></span></li></ul></section>
          <section aria-labelledby="next-title" class="flex flex-col gap-4"><h2 class="text-lg font-bold text-fg" data-i18n="student.quiz.nextSteps" id="next-title"></h2><ul class="flex flex-col gap-4"><li><a href="practice.html" class="flex items-start gap-4 rounded-xl border border-border bg-surface-raised p-4 hover:border-neutral-300 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus hover:shadow-md"><span class="inline-flex size-9 shrink-0 items-center justify-center rounded-full bg-surface-sunken text-fg"><svg class="size-5 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#lightbulb"/></svg></span><span class="flex flex-col"><span class="font-bold text-fg" data-i18n="student.quiz.stepPractice" data-i18n-vars='{"pattern": "sample.patterns.sign"}'></span><span class="text-sm text-fg-muted" data-i18n="student.quiz.stepPracticeWhy"></span></span></a></li><li><a href="chat.html" class="flex items-center gap-4 rounded-xl border border-border bg-surface-raised p-4 hover:border-neutral-300 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus hover:shadow-md"><span class="inline-flex size-9 shrink-0 items-center justify-center rounded-full bg-surface-sunken text-fg"><svg class="size-5 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#message-circle"/></svg></span><span class="font-bold text-fg" data-i18n="student.quiz.stepAsk"></span></a></li><li><a href="quiz.html" class="flex items-center gap-4 rounded-xl border border-border bg-surface-raised p-4 hover:border-neutral-300 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus hover:shadow-md"><span class="inline-flex size-9 shrink-0 items-center justify-center rounded-full bg-surface-sunken text-fg"><svg class="size-5 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#refresh-cw"/></svg></span><span class="font-bold text-fg" data-i18n="student.quiz.stepAnother"></span></a></li></ul></section>
        </div>
      </div>
    </main>
    <div data-include="partials/footer.html"></div>
  </body>
</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Resumen del cuestionario · DocentAI (prototipo)</title>
    <style>
      :root { color-scheme: light dark; }
      [data-cloak] { visibility: hidden; }
      [data-cloak] *, [data-cloak] *::before, [data-cloak] *::after { transition: none !important; }
      summary::-webkit-details-marker { display: none; }
    </style>
    <script type="module" src="../assets/js/prototype.js"></script>
  </head>
  <body data-cloak class="flex min-h-dvh flex-col bg-surface font-sans text-fg antialiased">
    <a href="#main" class="sr-only rounded-lg bg-primary-700 px-4 py-2 text-fg-inverse focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-50" data-i18n="common.a11y.skipToContent"></a>
    <div data-include="partials/shell-student.html"></div>
    <main id="main" tabindex="-1" class="mx-auto w-full max-w-6xl flex-1 px-4 py-8 sm:px-6 lg:py-12">
      <div class="mx-auto flex w-full max-w-3xl flex-col gap-8">
        <div class="flex flex-col gap-4 border-b-2 border-neutral-900 pb-4 sm:flex-row sm:items-end sm:justify-between"><div class="min-w-0 flex-1"><h1 class="text-3xl font-semibold text-fg sm:text-4xl" data-i18n="student.quiz.summaryTitle"></h1><p class="mt-1 text-sm font-semibold text-fg-muted" data-i18n="sample.course.name"></p></div></div>
        <div data-state="loading" class="rounded-xl border border-border bg-surface-raised p-6" data-component="Skeleton"><p role="status" class="sr-only" data-i18n="common.states.loading"></p><div class="flex flex-col gap-4 motion-safe:animate-pulse" aria-hidden="true"><div class="w-1/3 h-6 rounded-md bg-neutral-200"></div><div class="w-full h-4 rounded-md bg-neutral-200"></div><div class="w-5/6 h-4 rounded-md bg-neutral-200"></div><div class="w-full h-20 rounded-md bg-neutral-200"></div><div class="w-2/3 h-4 rounded-md bg-neutral-200"></div></div></div>
        <div data-state="error" role="alert" class="flex flex-col items-center gap-4 rounded-xl border border-danger-200 bg-danger-50 px-6 py-12 text-center" data-component="ErrorState"><span class="inline-flex size-12 items-center justify-center rounded-full bg-neutral-0 text-danger-700"><svg class="size-6 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#triangle-alert"/></svg></span><h2 class="text-lg font-semibold text-fg" data-i18n="student.quiz.summaryLoadError"></h2><p class="max-w-md text-fg" data-i18n="common.states.errorBody"></p><button type="button" data-goto="default" class="inline-flex min-h-11 items-center justify-center gap-2 rounded-lg px-4 text-sm font-semibold focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus disabled:cursor-not-allowed disabled:bg-neutral-200 disabled:text-neutral-600 border border-border-strong bg-surface-raised text-fg hover:bg-surface-sunken" data-component="Button" data-variant="secondary"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#refresh-cw"/></svg><span data-i18n="common.actions.retry"></span></button></div>
        <div data-state="default" class="flex flex-col gap-8">
          <section class="flex flex-col gap-4 sm:flex-row sm:items-center sm:gap-6" data-celebrate>
            <span class="relative inline-flex size-14 shrink-0 items-center justify-center rounded-full bg-primary-600 text-fg-inverse" data-celebrate-badge><svg class="size-7 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#check"/></svg></span>
            <div class="min-w-0 flex-1">
              <p class="font-serif text-5xl font-semibold text-fg tabular-nums sm:text-6xl" data-i18n="student.quiz.score" data-i18n-vars='{"right": "number:4", "total": "number:5"}'></p>
              <p class="mt-2 font-serif text-xl text-fg" data-celebrate-text data-i18n="student.quiz.celebrate"></p>
              <p class="w-fit bg-surface text-fg-muted" data-celebrate-text data-i18n="student.quiz.celebrateBody"></p>
            </div>
          </section>
          <section aria-labelledby="topics-title" class="rounded-xl border border-border bg-surface-raised p-6">
            <h2 class="text-xl font-semibold text-fg" data-i18n="student.quiz.byTopic" id="topics-title"></h2>
            <ul class="mt-4 border-t-2 border-neutral-900"><li class="grid grid-cols-3 items-center gap-4 border-b border-border py-4 last:border-b-0"><span class="col-span-2 font-semibold text-fg sm:col-span-1" data-i18n="sample.topics.linear"></span><span class="text-right text-sm font-semibold text-fg tabular-nums sm:order-last" data-i18n="student.quiz.score" data-i18n-vars='{"right": "number:3", "total": "number:4"}'></span><span class="col-span-3 h-2 rounded-sm bg-surface-sunken sm:col-span-1" aria-hidden="true"><span class="block h-2 w-3/4 rounded-sm bg-success-600"></span></span></li><li class="grid grid-cols-3 items-center gap-4 border-b border-border py-4 last:border-b-0"><span class="col-span-2 font-semibold text-fg sm:col-span-1" data-i18n="sample.topics.systems"></span><span class="text-right text-sm font-semibold text-fg tabular-nums sm:order-last" data-i18n="student.quiz.score" data-i18n-vars='{"right": "number:1", "total": "number:1"}'></span><span class="col-span-3 h-2 rounded-sm bg-surface-sunken sm:col-span-1" aria-hidden="true"><span class="block h-2 w-full rounded-sm bg-success-600"></span></span></li></ul>
          </section>
          <section aria-labelledby="next-title" class="overflow-hidden rounded-xl border border-border bg-surface-raised">
            <h2 class="px-6 pt-6 pb-4 text-xl font-semibold text-fg" data-i18n="student.quiz.nextSteps" id="next-title"></h2>
            <ul class="border-t border-border"><li class="border-b border-border last:border-b-0"><a href="practice.html" class="flex items-center gap-4 px-6 py-4 hover:bg-surface-sunken focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus"><span class="inline-flex size-9 shrink-0 items-center justify-center rounded-full border border-border-strong text-fg"><svg class="size-5 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#lightbulb"/></svg></span><span class="flex min-w-0 flex-1 flex-col"><span class="font-semibold text-fg" data-i18n="student.quiz.stepPractice" data-i18n-vars='{"pattern": "sample.patterns.sign"}'></span><span class="text-sm text-fg-muted" data-i18n="student.quiz.stepPracticeWhy"></span></span><svg class="size-5 text-fg-muted shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#chevron-right"/></svg></a></li><li class="border-b border-border last:border-b-0"><a href="chat.html" class="flex items-center gap-4 px-6 py-4 hover:bg-surface-sunken focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus"><span class="inline-flex size-9 shrink-0 items-center justify-center rounded-full border border-border-strong text-fg"><svg class="size-5 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#message-circle"/></svg></span><span class="flex min-w-0 flex-1 flex-col"><span class="font-semibold text-fg" data-i18n="student.quiz.stepAsk"></span></span><svg class="size-5 text-fg-muted shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#chevron-right"/></svg></a></li><li class="border-b border-border last:border-b-0"><a href="quiz.html" class="flex items-center gap-4 px-6 py-4 hover:bg-surface-sunken focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus"><span class="inline-flex size-9 shrink-0 items-center justify-center rounded-full border border-border-strong text-fg"><svg class="size-5 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#refresh-cw"/></svg></span><span class="flex min-w-0 flex-1 flex-col"><span class="font-semibold text-fg" data-i18n="student.quiz.stepAnother"></span></span><svg class="size-5 text-fg-muted shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#chevron-right"/></svg></a></li></ul>
          </section>
        </div>
      </div>
    </main>
    <div data-include="partials/footer.html"></div>
  </body>
</html>

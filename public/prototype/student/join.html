></div><div class="flex justify-end"><span data-state="default invalid-code expired-code disabled-code"><button type="submit" class="inline-flex items-center justify-center gap-2 rounded-lg font-semibold motion-safe:transition-colors motion-safe:duration-150 motion-safe:ease-standard focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus disabled:cursor-not-allowed disabled:border-transparent disabled:bg-neutral-200 disabled:text-neutral-600 disabled:shadow-none min-h-11 px-4 text-sm bg-primary-600 text-fg-inverse shadow-sm hover:bg-primary-700 w-full sm:w-auto" data-component="Button" data-variant="primary"><span data-i18n="student.join.continue"></span><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#chevron-right"/></svg></button></span><span data-state="loading" class="w-full sm:w-auto"><button type="button" disabled aria-busy="true" class="inline-flex items-center justify-center gap-2 rounded-lg font-semibold motion-safe:transition-colors motion-safe:duration-150 motion-safe:ease-standard focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus disabled:cursor-not-allowed disabled:border-transparent disabled:bg-neutral-200 disabled:text-neutral-600 disabled:shadow-none min-h-11 px-4 text-sm bg-primary-600 text-fg-inverse shadow-sm hover:bg-primary-700 w-full"><svg class="size-4 motion-safe:animate-spin shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#refresh-cw"/></svg><span data-i18n="student.join.searching"></span></button></span></div></form>

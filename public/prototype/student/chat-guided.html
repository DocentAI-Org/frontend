ffset-2 focus-visible:outline-focus disabled:cursor-not-allowed disabled:bg-neutral-200 disabled:text-neutral-600" data-i18n-attr="aria-label:common.actions.send"><svg class="size-5 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#send"/></svg></button><button type="button" data-state="hints-done-solution" data-goto="solution" class="inline-flex size-11 shrink-0 items-center justify-center rounded-lg bg-primary-600 text-fg-inverse hover:bg-primary-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus disabled:cursor-not-allowed disabled:bg-neutral-200 disabled:text-neutral-600" data-i18n-attr="aria-label:common.actions.send"><svg class="size-5 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#send"/></svg></button><button type="button" data-state="hints-done-hints-only solution no-source" data-goto="hints-done-hints-only" class="inline-flex size-11 shrink-0 items-center justify-center rounded-lg bg-primary-600 text-fg-inverse hover:bg-primary-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus disabled:cursor-not-allowed disabled:bg-neutral-200 disabled:text-neutral-600" data-i18n-attr="aria-label:common.actions.send"><svg class="size-5 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#send"/></svg></button><button type="button" data-state="loading load-error" disabled class="inline-flex size-11 shrink-0 items-center justify-center rounded-lg bg-primary-600 text-fg-inverse hover:bg-primary-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus disabled:cursor-not-allowed disabled:bg-neutral-200 disabled:text-neutral-600" data-i18n-attr="aria-label:common.actions.send"><svg class="size-5 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#send"/></svg></button></form>

      <dialog data-modal data-state="citation" data-close-state="@back" aria-labelledby="sheet-title" class="mx-0 mt-auto mb-0 max-h-dvh w-full max-w-none overflow-y-auto rounded-t-2xl border border-border bg-surface-raised p-0 text-fg shadow-lg backdrop:bg-scrim/50 lg:my-0 lg:mr-0 lg:ml-auto lg:h-dvh lg:max-h-none lg:w-md lg:max-w-md lg:rounded-none lg:rounded-l-2xl" data-component="CitationSheet"><span class="mx-auto mt-2 block h-1.5 w-10 rounded-full bg-neutral-300 lg:hidden" aria-hidden="true"></span><div class="flex items-center justify-between gap-4 border-b border-border px-6 py-4"><h2 id="sheet-title" class="text-lg font-bold" data-i18n="student.chat.citation.sheetTitle"></h2><form method="dialog"><button type="submit" class="inline-flex size-11 items-center justify-center rounded-lg text-fg-muted hover:bg-surface-sunken hover:text-fg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus" data-i18n-attr="aria-label:common.actions.close" data-component="IconButton"><svg class="size-5 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#x"/></svg></button></form></div><div class="flex flex-col gap-6 p-6"><div class="flex items-start gap-4"><span class="inline-flex size-10 shrink-0 items-center justify-center rounded-lg bg-surface-sunken text-fg"><svg class="size-5 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#file-text"/></svg></span><div class="min-w-0"><p class="font-semibold break-words text-fg" data-i18n="sample.documents.tema3"></p><p class="text-sm text-fg-muted" data-i18n="sample.chat.loc"></p></div></div><figure class="flex flex-col gap-2"><figcaption class="text-xs font-semibold tracking-wide text-fg-muted uppercase" data-i18n="student.chat.citation.passageLabel"></figcaption><blockquote class="rounded-r-lg border-l-4 border-primary-600 bg-surface-sunken p-4 text-fg" data-i18n="sample.chat.passage"></blockquote></figure><p class="flex items-center gap-2 text-sm text-fg-muted"><svg class="size-4

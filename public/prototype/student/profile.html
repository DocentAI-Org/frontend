<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Perfil · DocentAI (prototipo)</title>
    <style>
      :root { color-scheme: light dark; }
      [data-cloak] { visibility: hidden; }
      [data-cloak] *, [data-cloak] *::before, [data-cloak] *::after { transition: none !important; }
      summary::-webkit-details-marker { display: none; }
    </style>
    <script type="module" src="../assets/js/prototype.js"></script>
  </head>
  <body data-cloak class="flex min-h-dvh flex-col bg-surface font-sans text-fg antialiased">
    <a href="#main" class="sr-only rounded-lg bg-primary-700 px-4 py-2 text-fg-inverse focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-50" data-i18n="common.a11y.skipToContent"></a>
    <div data-include="partials/shell-student.html"></div>
    <main id="main" tabindex="-1" class="mx-auto w-full max-w-6xl flex-1 px-4 py-8 sm:px-6 lg:py-12">
      <div class="mx-auto flex w-full max-w-3xl flex-col gap-8">
        <div class="flex flex-col gap-4 border-b-2 border-neutral-900 pb-4 sm:flex-row sm:items-end sm:justify-between"><div class="min-w-0 flex-1"><h1 class="text-3xl font-semibold text-fg sm:text-4xl" data-i18n="student.profile.title"></h1></div></div>
        <div data-state="loading" class="rounded-xl border border-border bg-surface-raised p-6" data-component="Skeleton"><p role="status" class="sr-only" data-i18n="common.states.loading"></p><div class="flex flex-col gap-4 motion-safe:animate-pulse" aria-hidden="true"><div class="w-1/3 h-6 rounded-md bg-neutral-200"></div><div class="w-full h-4 rounded-md bg-neutral-200"></div><div class="w-5/6 h-4 rounded-md bg-neutral-200"></div><div class="w-full h-20 rounded-md bg-neutral-200"></div><div class="w-2/3 h-4 rounded-md bg-neutral-200"></div></div></div>
        <div data-state="error" role="alert" class="flex flex-col items-center gap-4 rounded-xl border border-danger-200 bg-danger-50 px-6 py-12 text-center" data-component="ErrorState"><span class="inline-flex size-12 items-center justify-center rounded-full bg-neutral-0 text-danger-700"><svg class="size-6 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#triangle-alert"/></svg></span><h2 class="text-lg font-semibold text-fg" data-i18n="student.profile.loadError"></h2><p class="max-w-md text-fg" data-i18n="common.states.errorBody"></p><button type="button" data-goto="default" class="inline-flex min-h-11 items-center justify-center gap-2 rounded-lg px-4 text-sm font-semibold focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus disabled:cursor-not-allowed disabled:bg-neutral-200 disabled:text-neutral-600 border border-border-strong bg-surface-raised text-fg hover:bg-surface-sunken" data-component="Button" data-variant="secondary"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#refresh-cw"/></svg><span data-i18n="common.actions.retry"></span></button></div>
        <div data-state="default revoke-confirm revoked" class="flex flex-col overflow-hidden rounded-xl border border-border bg-surface-raised">
          <section aria-labelledby="account-title" class="p-6">
            <h2 class="text-xl font-semibold text-fg" data-i18n="student.profile.accountTitle" id="account-title"></h2>
            <dl class="mt-4 border-t-2 border-neutral-900">
              <div class="grid gap-1 border-b border-border py-4 last:border-b-0 sm:grid-cols-3 sm:gap-6"><dt class="text-sm font-semibold text-fg-muted" data-i18n="student.profile.name"></dt><dd class="text-fg sm:col-span-2"><span data-i18n="sample.people.lucas"></span></dd></div>
              <div class="grid gap-1 border-b border-border py-4 last:border-b-0 sm:grid-cols-3 sm:gap-6"><dt class="text-sm font-semibold text-fg-muted" data-i18n="student.profile.email"></dt><dd class="break-words text-fg sm:col-span-2"><span data-i18n="sample.people.lucasEmail"></span></dd></div>
              <div class="grid gap-1 border-b border-border py-4 last:border-b-0 sm:grid-cols-3 sm:gap-6"><dt class="text-sm font-semibold text-fg-muted" data-i18n="student.profile.language"></dt><dd class="text-fg sm:col-span-2"><span data-i18n="common.language.es"></span></dd></div>
            </dl>
          </section>
          <section aria-labelledby="consent-title" class="flex flex-col gap-4 border-t border-border p-6">
            <div class="flex flex-wrap items-center gap-4">
              <h2 class="text-xl font-semibold text-fg" data-i18n="student.profile.consentTitle" id="consent-title"></h2>
              <span data-state="default revoke-confirm"><span class="inline-flex items-center gap-1 rounded-sm border border-success-300 bg-success-50 px-2 py-1 text-xs font-semibold text-success-800"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#check"/></svg><span class="tabular-nums" data-i18n="student.profile.consentAccepted" data-i18n-vars='{"date": "date:2026-10-05"}'></span></span></span>
              <span data-state="revoked"><span class="inline-flex items-center gap-1 rounded-sm border border-border-strong bg-surface-sunken px-2 py-1 text-xs font-semibold text-fg"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#lock"/></svg><span class="tabular-nums" data-i18n="student.profile.consentRevoked" data-i18n-vars='{"date": "date:2026-10-08"}'></span></span></span>
            </div>
            <p data-state="default revoke-confirm" class="max-w-prose text-fg" data-i18n="student.profile.consentBody"></p>
            <div data-state="revoked"><div role="status" class="flex items-start gap-4 rounded-lg border border-info-200 bg-info-50 p-4"><svg class="mt-1 size-5 text-info-800 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#info"/></svg><p class="min-w-0 flex-1 text-info-800" data-i18n="student.profile.revokedNotice"></p></div></div>
            <div class="flex flex-col gap-2 border-t border-border pt-4 sm:flex-row sm:items-center sm:justify-between">
              <a href="consent.html?state=ai-disclosure" class="inline-flex min-h-11 items-center justify-center gap-2 rounded-lg px-4 text-sm font-semibold focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus border border-border-strong bg-surface-raised text-fg hover:bg-surface-sunken" data-component="Button" data-variant="secondary"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#file-text"/></svg><span data-i18n="student.profile.review"></span></a>
              <span data-state="default revoke-confirm"><button type="button" data-goto="revoke-confirm" class="inline-flex min-h-11 items-center justify-center gap-2 rounded-lg px-4 text-sm font-semibold focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus bg-danger-600 text-fg-inverse hover:bg-danger-700 w-full sm:w-auto" data-component="Button" data-variant="danger"><span data-i18n="student.profile.revoke"></span></button></span>
              <span data-state="revoked"><a href="consent.html" class="inline-flex min-h-11 items-center justify-center gap-2 rounded-lg px-4 text-sm font-semibold focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus bg-primary-600 text-fg-inverse hover:bg-primary-700 w-full sm:w-auto" data-component="Button" data-variant="primary"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#check"/></svg><span data-i18n="student.profile.giveAgain"></span></a></span>
            </div>
          </section>
        </div>
      </div>
      <dialog data-modal data-state="revoke-confirm" data-close-state="default" aria-labelledby="revoke-title" class="m-auto w-full max-w-md rounded-2xl border border-border bg-surface-raised p-0 text-fg shadow-lg backdrop:bg-scrim/50" data-component="Dialog"><div class="flex flex-col gap-4 p-6"><h2 class="text-xl font-semibold" data-i18n="student.profile.revokeTitle" id="revoke-title"></h2><p class="text-fg-muted" data-i18n="student.profile.revokeBody"></p></div><div class="flex flex-col-reverse gap-2 border-t border-border p-4 sm:flex-row sm:justify-end"><form method="dialog" class="contents"><button type="submit" class="inline-flex min-h-11 items-center justify-center gap-2 rounded-lg px-4 text-sm font-semibold focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus disabled:cursor-not-allowed disabled:bg-neutral-200 disabled:text-neutral-600 border border-border-strong bg-surface-raised text-fg hover:bg-surface-sunken" data-component="Button" data-variant="secondary"><span data-i18n="common.actions.cancel"></span></button></form><button type="button" data-goto="revoked" class="inline-flex min-h-11 items-center justify-center gap-2 rounded-lg px-4 text-sm font-semibold focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus disabled:cursor-not-allowed disabled:bg-neutral-200 disabled:text-neutral-600 bg-danger-600 text-fg-inverse shadow-sm hover:bg-danger-700" data-component="Button" data-variant="danger"><span data-i18n="student.profile.revoke"></span></button></div></dialog>
    </main>
    <div data-include="partials/footer.html"></div>
  </body>
</html>

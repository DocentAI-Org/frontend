<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Enviar un ejercicio · DocentAI (prototipo)</title>
    <style>
      :root { color-scheme: light dark; }
      [data-cloak] { visibility: hidden; }
      [data-cloak] *, [data-cloak] *::before, [data-cloak] *::after { transition: none !important; }
      summary::-webkit-details-marker { display: none; }
    </style>
    <script type="module" src="../assets/js/prototype.js"></script>
  </head>
  <body data-cloak class="flex min-h-dvh flex-col bg-surface font-sans text-fg antialiased">
    <a href="#main" class="sr-only rounded-lg bg-primary-700 px-4 py-2 text-fg-inverse focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-50" data-i18n="common.a11y.skipToContent"></a>
    <div data-include="partials/shell-student.html"></div>
    <main id="main" tabindex="-1" class="mx-auto w-full max-w-6xl flex-1 px-4 py-8 sm:px-6 lg:py-12">
      <div class="mx-auto flex w-full max-w-3xl flex-col gap-8">
        <div class="flex flex-col gap-4 border-b-2 border-neutral-900 pb-4 sm:flex-row sm:items-end sm:justify-between"><div class="min-w-0 flex-1"><h1 class="text-3xl font-semibold text-fg sm:text-4xl" data-i18n="student.exercise.title"></h1><p class="mt-1 text-sm font-medium text-fg-muted" data-i18n="sample.course.name"></p><p class="mt-2 max-w-3xl text-fg-muted" data-i18n="student.exercise.lead"></p></div></div>
        <div data-state="default review empty-submission unreadable-photo"><p class="flex items-center gap-2 text-sm text-fg-muted" data-component="MessageAllowance" data-variant="normal"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#message-circle"/></svg><span class="tabular-nums" data-i18n="student.chat.remaining" data-i18n-count="12"></span></p></div>
        <section data-state="limit-reached" aria-labelledby="limit-title" class="rounded-xl border border-warning-300 bg-warning-50 p-4" data-component="LimitReachedBanner" data-variant="exercise"><div class="flex gap-4"><svg class="mt-1 size-6 text-warning-800 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#clock"/></svg><div class="min-w-0 flex-1"><h2 id="limit-title" class="font-semibold text-fg tabular-nums" data-i18n="student.chat.limit.title" data-i18n-vars='{"limit": "number:30"}'></h2><p class="mt-1 text-fg" data-i18n="student.chat.limit.exerciseBody" data-i18n-vars='{"time": "00:00"}'></p></div></div></section>
        <div data-state="loading" class="rounded-xl border border-border bg-surface-raised p-6" data-component="Skeleton"><p role="status" class="sr-only" data-i18n="common.states.loading"></p><div class="flex flex-col gap-4 motion-safe:animate-pulse" aria-hidden="true"><div class="w-1/3 h-5 rounded-md bg-neutral-200"></div><div class="w-full h-16 rounded-md bg-neutral-200"></div><div class="w-1/3 h-5 rounded-md bg-neutral-200"></div><div class="w-full h-32 rounded-md bg-neutral-200"></div></div></div>
        <form data-state="default empty-submission unreadable-photo limit-reached" novalidate data-route data-route-empty="#ex-problem,#ex-steps,#ex-photo" data-route-empty-target="empty-submission" data-route-default="review" class="rounded-xl border border-border bg-surface-raised flex flex-col gap-6 p-6"><div id="ex-form-error"><div data-state="empty-submission"><div role="alert" class="flex items-start gap-4 rounded-xl border border-danger-200 bg-danger-50 p-4"><svg class="mt-1 size-5 text-danger-700 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#triangle-alert"/></svg><div class="flex min-w-0 flex-1 flex-col gap-1"><p class="text-danger-700" data-i18n="student.exercise.emptyError"></p></div></div></div><div data-state="unreadable-photo"><div role="alert" class="flex items-start gap-4 rounded-xl border border-danger-200 bg-danger-50 p-4"><svg class="mt-1 size-5 text-danger-700 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#camera"/></svg><div class="flex min-w-0 flex-1 flex-col gap-1"><p class="text-danger-700" data-i18n="student.exercise.photoError"></p></div></div></div></div><div class="flex flex-col gap-2" data-component="TextArea"><label for="ex-problem" class="text-sm font-medium text-fg" data-i18n="student.exercise.problem"></label><textarea id="ex-problem" rows="2" class="min-h-11 w-full rounded-lg border border-border-strong bg-surface-raised px-4 text-base text-fg placeholder:text-fg-muted focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus disabled:cursor-not-allowed disabled:bg-surface-sunken disabled:text-fg-muted aria-invalid:border-danger-600 py-2" data-invalid-in="empty-submission" aria-describedby="ex-form-error" data-i18n-attr="placeholder:student.exercise.problemPlaceholder"></textarea></div><div class="flex flex-col gap-2" data-component="TextArea"><label for="ex-steps" class="text-sm font-medium text-fg" data-i18n="student.exercise.steps"></label><textarea id="ex-steps" rows="6" class="min-h-11 w-full rounded-lg border border-border-strong bg-surface-raised px-4 text-base text-fg placeholder:text-fg-muted focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus disabled:cursor-not-allowed disabled:bg-surface-sunken disabled:text-fg-muted aria-invalid:border-danger-600 py-2 font-serif italic bg-grid border-border" data-invalid-in="empty-submission" aria-describedby="ex-steps-help ex-form-error"></textarea><p class="text-sm text-fg-muted" data-i18n="student.exercise.stepsHelp" id="ex-steps-help"></p></div><div class="flex flex-col gap-2" data-component="TextField" data-variant="file"><label for="ex-photo" class="text-sm font-medium text-fg"><span data-i18n="student.exercise.photo"></span> <span class="font-normal text-fg-muted" data-i18n="student.exercise.optional"></span></label><input id="ex-photo" type="file" accept=".jpg,.jpeg,.png,image/jpeg,image/png" data-invalid-in="unreadable-photo" aria-describedby="ex-photo-help ex-photo-error" class="block w-full rounded-lg border border-border-strong bg-surface-raised p-2 text-sm text-fg file:mr-4 file:min-h-9 file:rounded-md file:border-0 file:bg-primary-50 file:px-4 file:font-semibold file:text-primary-800 hover:file:bg-primary-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus aria-invalid:border-danger-600" /><p class="text-sm text-fg-muted" data-i18n="student.exercise.photoHelp" id="ex-photo-help"></p><p id="ex-photo-error" class="text-sm text-danger-700"><span data-state="unreadable-photo" class="flex items-center gap-2"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#camera"/></svg><span data-i18n="sample.exercise.photo"></span></span></p></div><div class="flex justify-end border-t border-border pt-6"><span data-state="default empty-submission unreadable-photo"><button type="submit" class="inline-flex items-center justify-center gap-2 rounded-lg font-semibold motion-safe:transition-colors motion-safe:duration-150 motion-safe:ease-standard focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus disabled:cursor-not-allowed disabled:border-transparent disabled:bg-neutral-200 disabled:text-neutral-600 disabled:shadow-none min-h-11 px-4 text-sm bg-primary-600 text-fg-inverse hover:bg-primary-700" data-component="Button" data-variant="primary"><span data-i18n="student.exercise.review"></span><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#chevron-right"/></svg></button></span><span data-state="limit-reached"><button type="button" class="inline-flex items-center justify-center gap-2 rounded-lg font-semibold motion-safe:transition-colors motion-safe:duration-150 motion-safe:ease-standard focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus disabled:cursor-not-allowed disabled:border-transparent disabled:bg-neutral-200 disabled:text-neutral-600 disabled:shadow-none min-h-11 px-4 text-sm bg-primary-600 text-fg-inverse hover:bg-primary-700" data-component="Button" data-variant="primary" disabled><span data-i18n="student.exercise.review"></span><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#chevron-right"/></svg></button></span></div></form>
        <section data-state="review" aria-labelledby="review-title" class="rounded-xl border border-border bg-surface-raised flex flex-col gap-6 p-6"><div><h2 class="text-xl font-semibold text-fg" data-i18n="student.exercise.reviewTitle" id="review-title"></h2><p class="text-fg-muted" data-i18n="student.exercise.reviewLead"></p></div><dl class="flex flex-col gap-4"><div class="flex flex-col gap-1"><dt class="text-sm font-semibold text-fg-muted" data-i18n="student.exercise.problem"></dt><dd class="text-fg" data-mirror="#ex-problem" data-i18n="sample.exercise.statement"></dd></div><div class="flex flex-col gap-1"><dt class="text-sm font-semibold text-fg-muted" data-i18n="student.exercise.steps"></dt><dd class="rounded-lg p-4 whitespace-pre-line text-fg font-serif italic bg-grid border border-border" data-mirror="#ex-steps" data-i18n="sample.exercise.stepsAll"></dd></div><div class="flex flex-col gap-1"><dt class="text-sm font-semibold text-fg-muted" data-i18n="student.exercise.photo"></dt><dd class="text-fg" data-i18n="student.exercise.noPhoto"></dd></div></dl><div class="flex flex-col-reverse gap-2 border-t border-border pt-6 sm:flex-row sm:justify-end"><button type="button" data-goto="default" class="inline-flex items-center justify-center gap-2 rounded-lg font-semibold motion-safe:transition-colors motion-safe:duration-150 motion-safe:ease-standard focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus disabled:cursor-not-allowed disabled:border-transparent disabled:bg-neutral-200 disabled:text-neutral-600 disabled:shadow-none min-h-11 px-4 text-sm border border-border-strong bg-surface-raised text-fg hover:bg-surface-sunken" data-component="Button" data-variant="secondary"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#chevron-left"/></svg><span data-i18n="student.exercise.edit"></span></button><a href="exercise-feedback.html?state=pending" class="inline-flex items-center justify-center gap-2 rounded-lg font-semibold motion-safe:transition-colors motion-safe:duration-150 motion-safe:ease-standard focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus disabled:cursor-not-allowed disabled:border-transparent disabled:bg-neutral-200 disabled:text-neutral-600 disabled:shadow-none min-h-11 px-4 text-sm bg-primary-600 text-fg-inverse hover:bg-primary-700" data-component="Button" data-variant="primary"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#send"/></svg><span data-i18n="student.exercise.send"></span></a></div></section>
      </div>
    </main>
    <div data-include="partials/footer.html"></div>
  </body>
</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mis cursos · DocentAI (prototipo)</title>
    <style>
      :root { color-scheme: light dark; }
      [data-cloak] { visibility: hidden; }
      [data-cloak] *, [data-cloak] *::before, [data-cloak] *::after { transition: none !important; }
      summary::-webkit-details-marker { display: none; }
    </style>
    <script type="module" src="../assets/js/prototype.js"></script>
  </head>
  <body data-cloak class="flex min-h-dvh flex-col bg-surface font-sans text-fg antialiased">
    <a href="#main" class="sr-only rounded-lg bg-primary-700 px-4 py-2 text-fg-inverse focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-50" data-i18n="common.a11y.skipToContent"></a>
    <div data-include="partials/shell-student.html"></div>
    <main id="main" tabindex="-1" class="mx-auto w-full max-w-6xl flex-1 px-4 py-6 sm:px-6 lg:py-10">
      <div class="flex flex-col gap-6">
        <div class="flex flex-col gap-4 pb-2 sm:flex-row sm:items-end sm:justify-between sm:pb-4"><div class="min-w-0"><h1 class="text-3xl font-bold text-fg sm:text-4xl" data-i18n="student.courses.title"></h1></div><div class="flex flex-wrap gap-2"><a href="join.html" class="inline-flex items-center justify-center gap-2 rounded-lg font-semibold motion-safe:transition-colors motion-safe:duration-150 motion-safe:ease-standard focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus disabled:cursor-not-allowed disabled:border-transparent disabled:bg-neutral-200 disabled:text-neutral-600 disabled:shadow-none min-h-11 px-4 text-sm border border-border-strong bg-surface-raised text-fg hover:bg-surface-sunken" data-component="Button" data-variant="secondary"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#plus"/></svg><span data-i18n="student.courses.join"></span></a></div></div>
        <div data-state="default several-courses"><p class="flex items-center gap-2 text-sm text-fg-muted" data-component="MessageAllowance" data-variant="normal"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#message-circle"/></svg><span class="tabular-nums" data-i18n="student.chat.remaining" data-i18n-count="12"></span></p></div>
        <div data-state="loading" class="rounded-xl border border-border bg-surface-raised p-6" data-component="Skeleton"><p role="status" class="sr-only" data-i18n="common.states.loading"></p><div class="flex flex-col gap-4 motion-safe:animate-pulse" aria-hidden="true"><div class="w-1/3 h-6 rounded-md bg-neutral-200"></div><div class="w-full h-4 rounded-md bg-neutral-200"></div><div class="w-5/6 h-4 rounded-md bg-neutral-200"></div><div class="w-full h-20 rounded-md bg-neutral-200"></div><div class="w-2/3 h-4 rounded-md bg-neutral-200"></div></div></div>
        <div data-state="error" role="alert" class="flex flex-col items-center gap-4 rounded-xl border border-danger-200 bg-danger-50 px-6 py-12 text-center" data-component="ErrorState"><span class="inline-flex size-12 items-center justify-center rounded-full bg-neutral-0 text-danger-700"><svg class="size-6 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#triangle-alert"/></svg></span><h2 class="text-lg font-bold text-fg" data-i18n="student.courses.loadError"></h2><p class="max-w-md text-fg" data-i18n="common.states.errorBody"></p><button type="button" data-goto="default" class="inline-flex items-center justify-center gap-2 rounded-lg font-semibold motion-safe:transition-colors motion-safe:duration-150 motion-safe:ease-standard focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus disabled:cursor-not-allowed disabled:border-transparent disabled:bg-neutral-200 disabled:text-neutral-600 disabled:shadow-none min-h-11 px-4 text-sm border border-border-strong bg-surface-raised text-fg hover:bg-surface-sunken" data-component="Button" data-variant="secondary"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#refresh-cw"/></svg><span data-i18n="common.actions.retry"></span></button></div>
        <div data-state="empty" class="flex flex-col items-center gap-4 rounded-xl border border-dashed border-border-strong bg-surface-raised px-6 py-12 text-center" data-component="EmptyState"><span class="inline-flex size-12 items-center justify-center rounded-full bg-surface-sunken text-fg"><svg class="size-6 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#book-open"/></svg></span><h2 class="text-lg font-bold text-fg" data-i18n="student.courses.emptyTitle"></h2><p class="max-w-md text-fg-muted" data-i18n="student.courses.emptyBody"></p><a href="join.html" class="inline-flex items-center justify-center gap-2 rounded-lg font-semibold motion-safe:transition-colors motion-safe:duration-150 motion-safe:ease-standard focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus disabled:cursor-not-allowed disabled:border-transparent disabled:bg-neutral-200 disabled:text-neutral-600 disabled:shadow-none min-h-11 px-4 text-sm bg-primary-600 text-fg-inverse hover:bg-primary-700" data-component="Button" data-variant="primary"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#plus"/></svg><span data-i18n="student.courses.join"></span></a></div>
        <ul data-state="default several-courses" class="grid gap-4 lg:grid-cols-2">
          <li class="rounded-xl border border-border bg-surface-raised flex flex-col gap-4 p-6 hover:shadow-md" data-component="Card"><div><h2 class="text-lg font-bold text-fg" data-i18n="sample.course.name" id="c1"></h2><p class="text-sm text-fg-muted" data-i18n="student.courses.teacher" data-i18n-vars='{"teacher": "sample.people.teacher"}'></p><p class="mt-2 text-fg" data-i18n="sample.course.description"></p></div><nav aria-labelledby="c1" class="flex flex-wrap gap-2"><a href="chat.html" class="inline-flex min-h-11 items-center gap-2 rounded-lg border border-primary-600 bg-primary-600 px-4 text-sm font-semibold text-fg-inverse hover:border-primary-700 hover:bg-primary-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#message-circle"/></svg><span data-i18n="student.courses.openChat"></span></a><a href="exercise.html" class="inline-flex min-h-11 items-center gap-2 rounded-lg border border-border-strong bg-surface-raised px-4 text-sm font-semibold text-fg hover:bg-surface-sunken focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#file-text"/></svg><span data-i18n="student.courses.exercise"></span></a><a href="quiz.html" class="inline-flex min-h-11 items-center gap-2 rounded-lg border border-border-strong bg-surface-raised px-4 text-sm font-semibold text-fg hover:bg-surface-sunken focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#lightbulb"/></svg><span data-i18n="student.courses.quiz"></span></a><a href="progress.html" class="inline-flex min-h-11 items-center gap-2 rounded-lg border border-border-strong bg-surface-raised px-4 text-sm font-semibold text-fg hover:bg-surface-sunken focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#chart-column"/></svg><span data-i18n="student.courses.progress"></span></a></nav></li>
          <li data-state="several-courses" class="rounded-xl border border-border bg-surface-raised flex flex-col gap-4 p-6 hover:shadow-md" data-component="Card"><div><h2 class="text-lg font-bold text-fg" data-i18n="sample.courses.second" id="c2"></h2><p class="text-sm text-fg-muted" data-i18n="student.courses.teacher" data-i18n-vars='{"teacher": "sample.courses.secondTeacher"}'></p><p class="mt-2 text-fg" data-i18n="sample.courses.secondDescription"></p></div><nav aria-labelledby="c2" class="flex flex-wrap gap-2"><a href="chat.html" class="inline-flex min-h-11 items-center gap-2 rounded-lg border border-primary-600 bg-primary-600 px-4 text-sm font-semibold text-fg-inverse hover:border-primary-700 hover:bg-primary-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#message-circle"/></svg><span data-i18n="student.courses.openChat"></span></a><a href="exercise.html" class="inline-flex min-h-11 items-center gap-2 rounded-lg border border-border-strong bg-surface-raised px-4 text-sm font-semibold text-fg hover:bg-surface-sunken focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#file-text"/></svg><span data-i18n="student.courses.exercise"></span></a><a href="quiz.html" class="inline-flex min-h-11 items-center gap-2 rounded-lg border border-border-strong bg-surface-raised px-4 text-sm font-semibold text-fg hover:bg-surface-sunken focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#lightbulb"/></svg><span data-i18n="student.courses.quiz"></span></a><a href="progress.html" class="inline-flex min-h-11 items-center gap-2 rounded-lg border border-border-strong bg-surface-raised px-4 text-sm font-semibold text-fg hover:bg-surface-sunken focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#chart-column"/></svg><span data-i18n="student.courses.progress"></span></a></nav></li>
        </ul>
      </div>
    </main>
    <div data-include="partials/footer.html"></div>
  </body>
</html>

<header class="sticky top-0 z-40" data-component="AppShell" data-variant="student">
  <div class="border-b border-border-strong bg-surface-raised">
    <div class="mx-auto flex h-16 max-w-6xl items-stretch gap-6 px-4 sm:px-6">
      <a href="~/student/courses.html" class="flex shrink-0 items-center gap-2 self-center rounded-md focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus" data-i18n-attr="aria-label:common.a11y.homeLink">
        <img src="~/assets/img/docentai-logo-96.png" alt="" width="32" height="32" class="size-8 shrink-0" />
        <span class="font-serif text-xl font-semibold text-fg" data-i18n="common.brand.name"></span>
      </a>
      <nav class="hidden items-end md:flex" data-i18n-attr="aria-label:common.a11y.mainNav">
        <ul class="-mb-px flex items-end gap-1" data-nav>
          <li><a href="~/student/courses.html" class="flex h-11 items-center gap-2 rounded-t-lg border border-transparent px-4 text-sm font-medium text-fg-muted hover:bg-surface-sunken hover:text-fg focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-focus data-current:border-border-strong data-current:border-b-surface data-current:bg-surface data-current:font-semibold data-current:text-fg"><svg class="size-4 shrink-0" aria-hidden="true"><use href="~/assets/img/icons.svg#book-open"/></svg><span data-i18n="student.shell.nav.courses"></span></a></li>
          <li><a href="~/student/progress.html" class="flex h-11 items-center gap-2 rounded-t-lg border border-transparent px-4 text-sm font-medium text-fg-muted hover:bg-surface-sunken hover:text-fg focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-focus data-current:border-border-strong data-current:border-b-surface data-current:bg-surface data-current:font-semibold data-current:text-fg"><svg class="size-4 shrink-0" aria-hidden="true"><use href="~/assets/img/icons.svg#chart-column"/></svg><span data-i18n="student.shell.nav.progress"></span></a></li>
          <li><a href="~/student/profile.html" class="flex h-11 items-center gap-2 rounded-t-lg border border-transparent px-4 text-sm font-medium text-fg-muted hover:bg-surface-sunken hover:text-fg focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-focus data-current:border-border-strong data-current:border-b-surface data-current:bg-surface data-current:font-semibold data-current:text-fg"><svg class="size-4 shrink-0" aria-hidden="true"><use href="~/assets/img/icons.svg#user"/></svg><span data-i18n="student.shell.nav.profile"></span></a></li>
        </ul>
      </nav>
      <details class="relative ml-auto self-center">
        <summary class="flex min-h-11 cursor-pointer list-none items-center gap-2 rounded-lg px-2 text-sm font-medium text-fg hover:bg-surface-sunken focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus" data-i18n-attr="aria-label:common.a11y.userMenu">
          <span class="inline-flex size-8 items-center justify-center rounded-full border border-border-strong bg-surface text-fg"><svg class="size-4 shrink-0" aria-hidden="true"><use href="~/assets/img/icons.svg#user"/></svg></span>
          <span class="hidden sm:inline" data-i18n="sample.people.lucas"></span>
        </summary>
        <div class="absolute right-0 mt-2 w-64 rounded-xl border border-border bg-surface-raised p-2 shadow-lg">
          <p class="px-4 pt-2 font-semibold text-fg sm:hidden" data-i18n="sample.people.lucas"></p>
          <p class="px-4 pt-1 pb-2 text-sm text-fg-muted" data-i18n="student.shell.role"></p>
          <div role="group" class="mx-1 mb-2 flex rounded-lg border border-border-strong p-1" data-component="LanguageSwitcher" data-i18n-attr="aria-label:common.a11y.language">
            <button type="button" data-set-lang="es" lang="es" aria-pressed="false" class="min-h-9 flex-1 rounded-md px-4 text-sm font-medium text-fg hover:bg-surface-sunken focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus aria-pressed:bg-neutral-900 aria-pressed:text-fg-inverse" data-i18n="common.language.es"></button>
            <button type="button" data-set-lang="en" lang="en" aria-pressed="false" class="min-h-9 flex-1 rounded-md px-4 text-sm font-medium text-fg hover:bg-surface-sunken focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus aria-pressed:bg-neutral-900 aria-pressed:text-fg-inverse" data-i18n="common.language.en"></button>
          </div>
          <a href="~/auth/sign-in.html" class="flex min-h-11 w-full items-center gap-2 rounded-lg px-4 text-sm text-fg hover:bg-surface-sunken focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus"><svg class="size-4 shrink-0" aria-hidden="true"><use href="~/assets/img/icons.svg#log-out"/></svg><span data-i18n="common.actions.signOut"></span></a>
        </div>
      </details>
    </div>
  </div>
  <div class="border-b border-border bg-surface">
    <p class="mx-auto flex max-w-6xl items-center gap-2 px-4 py-2 text-sm text-fg-muted sm:px-6" data-component="AIDisclosure" data-variant="header-label">
      <svg class="size-4 shrink-0" aria-hidden="true"><use href="~/assets/img/icons.svg#sparkles"/></svg>
      <span><strong class="font-semibold text-fg" data-i18n="student.shell.aiLabel"></strong>: <span data-i18n="student.shell.teacherReview"></span></span>
    </p>
  </div>
  <nav class="pb-safe fixed inset-x-0 bottom-0 z-40 border-t border-border-strong bg-surface-raised md:hidden" data-i18n-attr="aria-label:common.a11y.mainNav">
    <ul class="grid h-16 grid-cols-3" data-nav>
      <li><a href="~/student/courses.html" class="relative flex h-full flex-col items-center justify-center gap-1 text-xs font-medium text-fg-muted hover:text-fg focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-focus before:absolute before:inset-x-6 before:top-0 before:h-1 before:rounded-b-sm before:bg-neutral-900 before:opacity-0 data-current:font-semibold data-current:text-fg data-current:before:opacity-100"><svg class="size-6 shrink-0" aria-hidden="true"><use href="~/assets/img/icons.svg#book-open"/></svg><span data-i18n="student.shell.nav.courses"></span></a></li>
      <li><a href="~/student/progress.html" class="relative flex h-full flex-col items-center justify-center gap-1 text-xs font-medium text-fg-muted hover:text-fg focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-focus before:absolute before:inset-x-6 before:top-0 before:h-1 before:rounded-b-sm before:bg-neutral-900 before:opacity-0 data-current:font-semibold data-current:text-fg data-current:before:opacity-100"><svg class="size-6 shrink-0" aria-hidden="true"><use href="~/assets/img/icons.svg#chart-column"/></svg><span data-i18n="student.shell.nav.progress"></span></a></li>
      <li><a href="~/student/profile.html" class="relative flex h-full flex-col items-center justify-center gap-1 text-xs font-medium text-fg-muted hover:text-fg focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-focus before:absolute before:inset-x-6 before:top-0 before:h-1 before:rounded-b-sm before:bg-neutral-900 before:opacity-0 data-current:font-semibold data-current:text-fg data-current:before:opacity-100"><svg class="size-6 shrink-0" aria-hidden="true"><use href="~/assets/img/icons.svg#user"/></svg><span data-i18n="student.shell.nav.profile"></span></a></li>
    </ul>
  </nav>
</header>

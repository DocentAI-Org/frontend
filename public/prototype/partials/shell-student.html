<header class="sticky top-0 z-40 border-b border-border bg-surface-raised" data-component="AppShell" data-variant="student">
  <div class="mx-auto flex h-16 max-w-6xl items-center gap-4 px-4 sm:px-6">
    <a href="~/student/courses.html" class="flex items-center gap-2 rounded-lg text-primary-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus">
      <img src="~/assets/img/docentai-logo-96.png" alt="" width="32" height="32" class="size-8 shrink-0" />
      <span class="text-lg font-bold text-fg" data-i18n="common.brand.name"></span>
    </a>
    <nav class="hidden md:block" data-i18n-attr="aria-label:common.a11y.mainNav">
      <ul class="flex items-center gap-1" data-nav>
          <li><a href="~/student/courses.html" class="inline-flex min-h-10 items-center rounded-lg px-3 text-sm font-medium text-fg-muted hover:bg-surface-sunken hover:text-fg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus data-current:bg-primary-50 data-current:text-primary-800" data-i18n="student.shell.nav.courses"></a></li>
          <li><a href="~/student/progress.html" class="inline-flex min-h-10 items-center rounded-lg px-3 text-sm font-medium text-fg-muted hover:bg-surface-sunken hover:text-fg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus data-current:bg-primary-50 data-current:text-primary-800" data-i18n="student.shell.nav.progress"></a></li>
          <li><a href="~/student/profile.html" class="inline-flex min-h-10 items-center rounded-lg px-3 text-sm font-medium text-fg-muted hover:bg-surface-sunken hover:text-fg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus data-current:bg-primary-50 data-current:text-primary-800" data-i18n="student.shell.nav.profile"></a></li>
      </ul>
    </nav>
    <div class="ml-auto flex items-center gap-2">
      <details class="relative hidden md:block">
        <summary class="flex min-h-10 cursor-pointer list-none items-center gap-2 rounded-lg px-2 text-sm font-medium text-fg hover:bg-surface-sunken focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus" data-i18n-attr="aria-label:common.a11y.userMenu">
          <span class="inline-flex size-8 items-center justify-center rounded-full bg-primary-100 text-primary-800"><svg class="size-4 shrink-0" aria-hidden="true"><use href="~/assets/img/icons.svg#user"/></svg></span>
          <span data-i18n="sample.people.lucas"></span>
        </summary>
        <div class="absolute right-0 mt-2 w-64 rounded-xl border border-border bg-surface-raised p-2 shadow-lg">
          <p class="px-3 pt-1 pb-2 text-xs text-fg-muted" data-i18n="student.shell.role"></p>
          <div role="group" class="mx-1 mb-2 flex rounded-lg border border-border-strong p-0.5" data-component="LanguageSwitcher" data-i18n-attr="aria-label:common.a11y.language">
            <button type="button" data-set-lang="es" lang="es" aria-pressed="false" class="min-h-8 flex-1 rounded-md px-3 text-sm font-medium text-fg hover:bg-surface-sunken focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus aria-pressed:bg-primary-700 aria-pressed:text-fg-inverse" data-i18n="common.language.es"></button>
            <button type="button" data-set-lang="en" lang="en" aria-pressed="false" class="min-h-8 flex-1 rounded-md px-3 text-sm font-medium text-fg hover:bg-surface-sunken focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus aria-pressed:bg-primary-700 aria-pressed:text-fg-inverse" data-i18n="common.language.en"></button>
          </div>
          <a href="~/auth/sign-in.html" class="flex min-h-10 w-full items-center gap-2 rounded-lg px-3 text-sm text-fg hover:bg-surface-sunken focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus"><svg class="size-4 shrink-0" aria-hidden="true"><use href="~/assets/img/icons.svg#log-out"/></svg><span data-i18n="common.actions.signOut"></span></a>
        </div>
      </details>
      <details class="relative md:hidden">
        <summary class="flex size-11 cursor-pointer list-none items-center justify-center rounded-lg text-fg hover:bg-surface-sunken focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus" data-i18n-attr="aria-label:common.a11y.openMenu">
          <svg class="size-6 shrink-0" aria-hidden="true"><use href="~/assets/img/icons.svg#menu"/></svg>
        </summary>
        <div class="absolute right-0 mt-2 w-72 rounded-xl border border-border bg-surface-raised p-2 shadow-lg">
          <nav data-i18n-attr="aria-label:common.a11y.mainNav">
            <ul class="flex flex-col gap-1" data-nav>
            <li><a href="~/student/courses.html" class="flex min-h-11 items-center rounded-lg px-3 text-base font-medium text-fg hover:bg-surface-sunken focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus data-current:bg-primary-50 data-current:text-primary-800" data-i18n="student.shell.nav.courses"></a></li>
            <li><a href="~/student/progress.html" class="flex min-h-11 items-center rounded-lg px-3 text-base font-medium text-fg hover:bg-surface-sunken focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus data-current:bg-primary-50 data-current:text-primary-800" data-i18n="student.shell.nav.progress"></a></li>
            <li><a href="~/student/profile.html" class="flex min-h-11 items-center rounded-lg px-3 text-base font-medium text-fg hover:bg-surface-sunken focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus data-current:bg-primary-50 data-current:text-primary-800" data-i18n="student.shell.nav.profile"></a></li>
            </ul>
          </nav>
          <div class="my-2 border-t border-border"></div>
          <p class="px-3 pb-2 text-sm font-medium text-fg" data-i18n="sample.people.lucas"></p>
          <div role="group" class="mx-1 mb-2 flex rounded-lg border border-border-strong p-0.5" data-component="LanguageSwitcher" data-i18n-attr="aria-label:common.a11y.language">
            <button type="button" data-set-lang="es" lang="es" aria-pressed="false" class="min-h-8 flex-1 rounded-md px-3 text-sm font-medium text-fg hover:bg-surface-sunken focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus aria-pressed:bg-primary-700 aria-pressed:text-fg-inverse" data-i18n="common.language.es"></button>
            <button type="button" data-set-lang="en" lang="en" aria-pressed="false" class="min-h-8 flex-1 rounded-md px-3 text-sm font-medium text-fg hover:bg-surface-sunken focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus aria-pressed:bg-primary-700 aria-pressed:text-fg-inverse" data-i18n="common.language.en"></button>
          </div>
          <a href="~/auth/sign-in.html" class="flex min-h-10 w-full items-center gap-2 rounded-lg px-3 text-sm text-fg hover:bg-surface-sunken focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus"><svg class="size-4 shrink-0" aria-hidden="true"><use href="~/assets/img/icons.svg#log-out"/></svg><span data-i18n="common.actions.signOut"></span></a>
        </div>
      </details>
    </div>
  </div>
  <div class="border-t border-border bg-info-50">
    <p class="mx-auto flex max-w-6xl items-center gap-2 px-4 py-2 text-sm text-info-800 sm:px-6" data-component="AIDisclosure" data-variant="header-label">
      <svg class="size-4 shrink-0" aria-hidden="true"><use href="~/assets/img/icons.svg#sparkles"/></svg>
      <span><strong class="font-semibold" data-i18n="student.shell.aiLabel"></strong> · <span data-i18n="student.shell.teacherReview"></span></span>
    </p>
  </div>
</header>

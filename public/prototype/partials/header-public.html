<header class="border-b border-border bg-surface-raised" data-component="AppShell" data-variant="public">
  <div class="mx-auto flex h-16 max-w-6xl items-center justify-between gap-4 px-4 sm:px-6">
    <span class="flex items-center gap-2 text-primary-700">
      <img src="~/assets/img/docentai-logo-96.png" alt="" width="32" height="32" class="size-8 shrink-0" />
      <span class="text-lg font-bold text-fg" data-i18n="common.brand.name"></span>
    </span>
    <div role="group" class="inline-flex rounded-lg border border-border-strong p-1" data-component="LanguageSwitcher" data-i18n-attr="aria-label:common.a11y.language">
      <button type="button" data-set-lang="es" lang="es" aria-pressed="false" class="min-h-8 rounded-md px-4 text-sm font-medium text-fg hover:bg-surface-sunken focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus aria-pressed:bg-neutral-900 aria-pressed:text-fg-inverse" data-i18n="common.language.es"></button>
      <button type="button" data-set-lang="en" lang="en" aria-pressed="false" class="min-h-8 rounded-md px-4 text-sm font-medium text-fg hover:bg-surface-sunken focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus aria-pressed:bg-neutral-900 aria-pressed:text-fg-inverse" data-i18n="common.language.en"></button>
    </div>
  </div>
</header>

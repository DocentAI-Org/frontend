<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recuperar la contraseña · DocentAI (prototipo)</title>
    <style>
      :root { color-scheme: light dark; }
      [data-cloak] { visibility: hidden; }
      [data-cloak] *, [data-cloak] *::before, [data-cloak] *::after { transition: none !important; }
      summary::-webkit-details-marker { display: none; }
    </style>
    <script type="module" src="../assets/js/prototype.js"></script>
  </head>
  <body data-cloak class="flex min-h-dvh flex-col bg-surface font-sans text-fg antialiased">
    <a href="#main" class="sr-only rounded-lg bg-primary-700 px-4 py-2 text-fg-inverse focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-50" data-i18n="common.a11y.skipToContent"></a>
    <div data-include="partials/header-public.html"></div>
    <main id="main" tabindex="-1" class="mx-auto w-full max-w-6xl flex-1 px-4 py-8 sm:px-6 lg:py-16">
      <div class="mx-auto flex w-full max-w-md flex-col gap-6">
        <a href="sign-in.html" class="inline-flex w-fit items-center gap-1 rounded-sm bg-surface text-sm font-semibold text-fg-muted hover:text-fg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#chevron-left"/></svg><span data-i18n="common.auth.backToSignIn"></span></a>
        <div class="flex flex-col gap-6 rounded-xl border border-border bg-surface-raised p-6 sm:p-8">
          <div class="border-b-2 border-neutral-900 pb-4">
            <h1 class="text-3xl font-semibold text-fg" data-i18n="common.auth.recoveryTitle"></h1>
            <p class="mt-2 text-fg-muted" data-i18n="common.auth.recoveryLead"></p>
          </div>
          <div data-state="error"><div role="alert" class="flex items-start gap-4 rounded-lg border border-danger-200 bg-danger-50 p-4"><svg class="mt-0.5 size-5 shrink-0 text-danger-700" aria-hidden="true"><use href="../assets/img/icons.svg#triangle-alert"/></svg><div class="flex min-w-0 flex-1 flex-col gap-1"><p class="text-danger-700" data-i18n="common.auth.recoveryError"></p></div></div></div>
          <form data-state="default loading error" data-route data-route-default="sent" class="flex flex-col gap-4"><div class="flex flex-col gap-2" data-component="TextField"><label for="rec-email" class="text-sm font-semibold text-fg" data-i18n="common.auth.email"></label><input id="rec-email" type="email" required class="min-h-11 w-full rounded-lg border border-border-strong bg-surface-raised px-4 text-base text-fg placeholder:text-fg-muted focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus disabled:cursor-not-allowed disabled:bg-surface-sunken disabled:text-fg-muted aria-invalid:border-danger-600" autocomplete="username" data-i18n-attr="placeholder:common.auth.emailPlaceholder" /></div><span data-state="default error"><button type="submit" class="inline-flex min-h-11 w-full items-center justify-center gap-2 rounded-lg bg-primary-600 px-4 text-sm font-semibold text-fg-inverse hover:bg-primary-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus" data-component="Button" data-variant="primary"><span data-i18n="common.auth.sendLink"></span></button></span><span data-state="loading"><button type="button" disabled aria-busy="true" class="inline-flex min-h-11 w-full items-center justify-center gap-2 rounded-lg bg-primary-600 px-4 text-sm font-semibold text-fg-inverse focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus disabled:cursor-not-allowed disabled:bg-neutral-200 disabled:text-neutral-600" data-component="Button" data-variant="primary"><svg class="size-4 shrink-0 motion-safe:animate-spin" aria-hidden="true"><use href="../assets/img/icons.svg#refresh-cw"/></svg><span data-i18n="common.auth.sending"></span></button></span></form>
          <div data-state="sent" class="flex flex-col gap-4">
            <div role="status"><div class="flex items-start gap-4 rounded-lg border border-success-300 bg-success-50 p-4"><svg class="mt-0.5 size-5 shrink-0 text-success-800" aria-hidden="true"><use href="../assets/img/icons.svg#check"/></svg><div class="flex min-w-0 flex-1 flex-col gap-1"><p class="text-success-800" data-i18n="common.auth.sent"></p></div></div></div>
            <a href="sign-in.html" class="inline-flex min-h-11 items-center justify-center gap-2 rounded-lg border border-border-strong bg-surface-raised px-4 text-sm font-semibold text-fg hover:bg-surface-sunken focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus" data-component="Button" data-variant="secondary"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#chevron-left"/></svg><span data-i18n="common.auth.backToSignIn"></span></a>
          </div>
        </div>
      </div>
    </main>
    <div data-include="partials/footer.html"></div>
  </body>
</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acerca de DocentAI · DocentAI (prototipo)</title>
    <style>
      [data-cloak] { visibility: hidden; }
      [data-cloak] *, [data-cloak] *::before, [data-cloak] *::after { transition: none !important; }
      summary::-webkit-details-marker { display: none; }
    </style>
    <script type="module" src="assets/js/prototype.js"></script>
  </head>
  <body data-cloak class="flex min-h-dvh flex-col bg-surface font-sans text-fg antialiased">
    <a href="#main" class="sr-only rounded-lg bg-primary-700 px-4 py-2 text-fg-inverse focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-50" data-i18n="common.a11y.skipToContent"></a>
    <div data-include="partials/header-public.html"></div>
    <main id="main" tabindex="-1" class="mx-auto w-full max-w-6xl flex-1 px-4 py-6 sm:px-6 lg:py-10">
      <div class="mx-auto flex w-full max-w-3xl flex-col gap-8">
        <div class="flex flex-col gap-3">
          <a href="auth/sign-in.html" class="rounded-sm text-primary-700 underline underline-offset-2 hover:text-primary-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus inline-flex items-center gap-1 self-start text-sm"><svg class="size-4 shrink-0" aria-hidden="true"><use href="assets/img/icons.svg#chevron-left"/></svg><span data-i18n="about.back"></span></a>
          <h1 class="text-3xl font-bold text-fg" data-i18n="about.title"></h1>
          <p class="text-lg text-fg-muted" data-i18n="about.lead"></p>
        </div>
        <section aria-labelledby="funding-title" class="flex flex-col gap-3">
          <h2 class="text-xl font-semibold text-fg" data-i18n="about.fundingTitle" id="funding-title"></h2>
          <div class="flex flex-col items-start gap-4 rounded-xl border border-border bg-surface-raised p-6 sm:flex-row sm:items-center" data-component="ImfaheAcknowledgement" data-variant="about"><span class="inline-flex h-16 w-40 shrink-0 items-center justify-center rounded-lg border border-dashed border-border-strong px-3 text-center text-sm leading-tight text-fg-muted" data-i18n="common.imfahe.logoPending"></span><p class="text-base text-fg" data-i18n="common.imfahe.acknowledgement"></p></div>
        </section>
        <section id="privacy" aria-labelledby="privacy-title" class="flex scroll-mt-24 flex-col gap-3">
          <h2 class="text-xl font-semibold text-fg" data-i18n="about.privacyTitle" id="privacy-title"></h2>
          <ul class="flex list-disc flex-col gap-2 pl-5 text-fg"><li data-i18n="about.privacy1"></li><li data-i18n="about.privacy2"></li><li data-i18n="about.privacy3"></li></ul>
          <p class="text-fg-muted" data-i18n="about.contact" data-i18n-vars='{"email": "sample.privacyEmail"}'></p>
        </section>
      </div>
    </main>
    <div data-include="partials/footer.html"></div>

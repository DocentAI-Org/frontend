<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cursos · DocentAI (prototipo)</title>
    <style>
      :root { color-scheme: light dark; }
      [data-cloak] { visibility: hidden; }
      [data-cloak] *, [data-cloak] *::before, [data-cloak] *::after { transition: none !important; }
      summary::-webkit-details-marker { display: none; }
    </style>
    <script type="module" src="../assets/js/prototype.js"></script>
  </head>
  <body data-cloak class="flex min-h-dvh flex-col bg-surface font-sans text-fg antialiased">
    <a href="#main" class="sr-only rounded-lg bg-primary-700 px-4 py-2 text-fg-inverse focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-50" data-i18n="common.a11y.skipToContent"></a>
    <div data-include="partials/shell-admin.html"></div>
    <main id="main" tabindex="-1" class="mx-auto w-full max-w-6xl flex-1 px-4 py-6 sm:px-6 lg:py-10">
      <div class="flex flex-col gap-6">
        <div class="flex flex-col gap-4 pb-2 sm:flex-row sm:items-end sm:justify-between sm:pb-4"><div class="min-w-0"><h1 class="text-3xl font-bold text-fg sm:text-4xl" data-i18n="admin.courses.title"></h1><p class="mt-2 max-w-3xl text-fg-muted" data-i18n="admin.courses.lead"></p></div></div>
        <div data-state="loading" class="rounded-xl border border-border bg-surface-raised p-6" data-component="Skeleton"><p role="status" class="sr-only" data-i18n="common.states.loading"></p><div class="flex flex-col gap-4 motion-safe:animate-pulse" aria-hidden="true"><div class="w-1/3 h-6 rounded-md bg-neutral-200"></div><div class="w-full h-4 rounded-md bg-neutral-200"></div><div class="w-5/6 h-4 rounded-md bg-neutral-200"></div><div class="w-full h-20 rounded-md bg-neutral-200"></div><div class="w-2/3 h-4 rounded-md bg-neutral-200"></div></div></div>
        <div data-state="error" role="alert" class="flex flex-col items-center gap-4 rounded-xl border border-danger-200 bg-danger-50 px-6 py-12 text-center" data-component="ErrorState"><span class="inline-flex size-12 items-center justify-center rounded-full bg-neutral-0 text-danger-700"><svg class="size-6 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#triangle-alert"/></svg></span><h2 class="text-lg font-bold text-fg" data-i18n="admin.courses.loadError"></h2><p class="max-w-md text-fg" data-i18n="common.states.errorBody"></p><button type="button" data-goto="default" class="inline-flex items-center justify-center gap-2 rounded-lg font-semibold motion-safe:transition-colors motion-safe:duration-150 motion-safe:ease-standard focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus disabled:cursor-not-allowed disabled:border-transparent disabled:bg-neutral-200 disabled:text-neutral-600 disabled:shadow-none min-h-11 px-4 text-sm border border-border-strong bg-surface-raised text-fg hover:bg-surface-sunken" data-component="Button" data-variant="secondary"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#refresh-cw"/></svg><span data-i18n="common.actions.retry"></span></button></div>
        <div data-state="empty" class="flex flex-col items-center gap-4 rounded-xl border border-dashed border-border-strong bg-surface-raised px-6 py-12 text-center" data-component="EmptyState"><span class="inline-flex size-12 items-center justify-center rounded-full bg-surface-sunken text-fg"><svg class="size-6 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#book-open"/></svg></span><h2 class="text-lg font-bold text-fg" data-i18n="admin.courses.emptyTitle"></h2><p class="max-w-md text-fg-muted" data-i18n="admin.courses.emptyBody"></p></div>
        <div data-state="default" class="overflow-x-auto rounded-xl border border-border bg-surface-raised"><table class="w-full text-sm"><caption class="sr-only" data-i18n="admin.courses.tableCaption"></caption><thead class="bg-surface-sunken"><tr><th class="px-4 py-4 text-left text-xs font-semibold tracking-wide text-fg-muted uppercase" data-i18n="admin.courses.colCourse" scope="col"></th><th class="px-4 py-4 text-left text-xs font-semibold tracking-wide text-fg-muted uppercase" data-i18n="admin.courses.colTeacher" scope="col"></th><th class="px-4 py-4 text-left text-xs font-semibold tracking-wide text-fg-muted uppercase" data-i18n="admin.courses.colStudents" scope="col"></th><th class="px-4 py-4 text-left text-xs font-semibold tracking-wide text-fg-muted uppercase" data-i18n="admin.courses.colCreated" scope="col"></th></tr></thead><tbody><tr class="border-t border-border"><th scope="row" class="px-4 py-4 align-middle text-left font-medium text-fg"><span data-i18n="sample.course.name"></span></th><td class="px-4 py-4 align-middle text-fg"><span data-i18n="sample.people.teacher"></span></td><td class="px-4 py-4 align-middle text-fg tabular-nums" data-i18n-number="24"></td><td class="px-4 py-4 align-middle text-fg-muted"><time data-i18n-date="2026-10-04"></time></td></tr><tr class="border-t border-border"><th scope="row" class="px-4 py-4 align-middle text-left font-medium text-fg"><span data-i18n="sample.courses.third"></span></th><td class="px-4 py-4 align-middle text-fg"><span data-i18n="sample.people.teacher"></span></td><td class="px-4 py-4 align-middle text-fg tabular-nums" data-i18n-number="18"></td><td class="px-4 py-4 align-middle text-fg-muted"><time data-i18n-date="2026-09-20"></time></td></tr><tr class="border-t border-border"><th scope="row" class="px-4 py-4 align-middle text-left font-medium text-fg"><span data-i18n="sample.courses.second"></span></th><td class="px-4 py-4 align-middle text-fg"><span data-i18n="sample.courses.secondTeacher"></span></td><td class="px-4 py-4 align-middle text-fg tabular-nums" data-i18n-number="21"></td><td class="px-4 py-4 align-middle text-fg-muted"><time data-i18n-date="2026-09-15"></time></td></tr></tbody></table></div>
      </div>
    </main>
    <div data-include="partials/footer.html"></div>
  </body>
</html>

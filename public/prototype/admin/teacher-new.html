<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crear cuenta de profesor/a · DocentAI (prototipo)</title>
    <style>
      :root { color-scheme: light dark; }
      [data-cloak] { visibility: hidden; }
      [data-cloak] *, [data-cloak] *::before, [data-cloak] *::after { transition: none !important; }
      summary::-webkit-details-marker { display: none; }
    </style>
    <script type="module" src="../assets/js/prototype.js"></script>
  </head>
  <body data-cloak class="flex min-h-dvh flex-col bg-surface font-sans text-fg antialiased">
    <a href="#main" class="sr-only rounded-lg bg-primary-700 px-4 py-2 text-fg-inverse focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-50" data-i18n="common.a11y.skipToContent"></a>
    <div data-include="partials/shell-admin.html"></div>
    <main id="main" tabindex="-1" class="mx-auto w-full max-w-6xl flex-1 px-4 py-8 sm:px-6 lg:px-10 lg:py-12">
      <div class="mx-auto flex w-full max-w-xl flex-col gap-6">
        <a href="users.html" class="inline-flex w-fit items-center gap-1 rounded-sm bg-surface text-sm font-semibold text-fg-muted hover:text-fg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#chevron-left"/></svg><span data-i18n="admin.teacherNew.back"></span></a>
        <div class="flex flex-col gap-6 rounded-xl border border-border bg-surface-raised p-6 sm:p-8">
          <div class="border-b-2 border-neutral-900 pb-4"><h1 class="text-3xl font-semibold text-fg" data-i18n="admin.teacherNew.title"></h1><p class="mt-2 text-fg-muted" data-i18n="admin.teacherNew.lead"></p></div>
          <form data-state="default validation-error loading" novalidate data-route data-route-empty="#tn-name,#tn-email" data-route-empty-target="validation-error" data-route-default="created" class="flex flex-col gap-6">
            <div data-state="validation-error"><div role="alert" class="flex items-start gap-4 rounded-lg border border-danger-200 bg-danger-50 p-4"><svg class="mt-0.5 size-5 text-danger-700 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#triangle-alert"/></svg><div class="flex min-w-0 flex-1 flex-col gap-1"><p class="text-danger-700" data-i18n="admin.teacherNew.errorSummary"></p></div></div></div>
            <div class="flex flex-col gap-2" data-component="TextField"><label for="tn-name" class="text-sm font-semibold text-fg" data-i18n="admin.teacherNew.name"></label><input id="tn-name" type="text" class="min-h-11 w-full rounded-lg border border-border-strong bg-surface-raised px-4 text-base text-fg placeholder:text-fg-muted focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus disabled:cursor-not-allowed disabled:bg-surface-sunken disabled:text-fg-muted aria-invalid:border-danger-600" autocomplete="name" data-invalid-in="validation-error" aria-describedby="tn-name-error" /><p id="tn-name-error" class="text-sm text-danger-700"><span data-state="validation-error" class="flex items-center gap-2"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#triangle-alert"/></svg><span data-i18n="admin.teacherNew.nameError"></span></span></p></div>
            <div class="flex flex-col gap-2" data-component="TextField"><label for="tn-email" class="text-sm font-semibold text-fg" data-i18n="admin.teacherNew.email"></label><input id="tn-email" type="email" class="min-h-11 w-full rounded-lg border border-border-strong bg-surface-raised px-4 text-base text-fg placeholder:text-fg-muted focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus disabled:cursor-not-allowed disabled:bg-surface-sunken disabled:text-fg-muted aria-invalid:border-danger-600" autocomplete="email" data-invalid-in="validation-error" aria-describedby="tn-email-help tn-email-error" data-i18n-attr="placeholder:common.auth.emailPlaceholder" /><p class="text-sm text-fg-muted" data-i18n="admin.teacherNew.emailHelp" id="tn-email-help"></p><p id="tn-email-error" class="text-sm text-danger-700"><span data-state="validation-error" class="flex items-center gap-2"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#triangle-alert"/></svg><span data-i18n="admin.teacherNew.emailError"></span></span></p></div>
            <div class="flex flex-col-reverse gap-2 border-t border-border pt-6 sm:flex-row sm:justify-end"><a href="users.html" class="inline-flex min-h-11 items-center justify-center gap-2 rounded-lg px-4 text-sm font-semibold text-fg hover:bg-surface-sunken focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus" data-component="Button" data-variant="ghost"><span data-i18n="common.actions.cancel"></span></a><span data-state="default validation-error"><button type="submit" class="inline-flex min-h-11 items-center justify-center gap-2 rounded-lg bg-primary-600 px-4 text-sm font-semibold text-fg-inverse hover:bg-primary-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus disabled:cursor-not-allowed disabled:bg-neutral-200 disabled:text-neutral-600 w-full sm:w-auto" data-component="Button" data-variant="primary"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#send"/></svg><span data-i18n="admin.teacherNew.submit"></span></button></span><span data-state="loading"><button type="button" disabled aria-busy="true" class="inline-flex min-h-11 items-center justify-center gap-2 rounded-lg bg-primary-600 px-4 text-sm font-semibold text-fg-inverse hover:bg-primary-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus disabled:cursor-not-allowed disabled:bg-neutral-200 disabled:text-neutral-600 w-full sm:w-auto" data-component="Button" data-variant="primary"><svg class="size-4 motion-safe:animate-spin shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#refresh-cw"/></svg><span data-i18n="admin.teacherNew.sending"></span></button></span></div>
          </form>
          <section data-state="created" aria-labelledby="created-title" class="flex flex-col gap-4">
            <div class="flex items-center gap-4"><span class="inline-flex size-10 items-center justify-center rounded-full border border-success-600 text-success-800"><svg class="size-5 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#check"/></svg></span><h2 class="text-2xl font-semibold text-fg" data-i18n="admin.teacherNew.createdTitle" id="created-title"></h2></div>
            <p class="text-fg" data-i18n="admin.teacherNew.createdBody" data-i18n-vars='{"email": "sample.people.newTeacherEmail"}'></p>
            <div role="status" class="flex flex-wrap items-center gap-2 border-y border-border py-4"><span class="font-semibold text-fg" data-i18n="sample.people.newTeacher"></span><span class="inline-flex items-center gap-1 rounded-sm py-0.5 text-sm font-semibold text-warning-900 bg-warning-200 px-2"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#clock"/></svg><span data-i18n="admin.users.status.pending"></span></span></div>
            <div class="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end"><a href="?state=default" class="inline-flex min-h-11 items-center justify-center gap-2 rounded-lg border border-border-strong bg-surface-raised px-4 text-sm font-semibold text-fg hover:bg-surface-sunken focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus" data-component="Button" data-variant="secondary"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#plus"/></svg><span data-i18n="admin.teacherNew.createAnother"></span></a><a href="users.html" class="inline-flex min-h-11 items-center justify-center gap-2 rounded-lg bg-primary-600 px-4 text-sm font-semibold text-fg-inverse hover:bg-primary-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus disabled:cursor-not-allowed disabled:bg-neutral-200 disabled:text-neutral-600" data-component="Button" data-variant="primary"><svg class="size-4 shrink-0" aria-hidden="true"><use href="../assets/img/icons.svg#chevron-left"/></svg><span data-i18n="admin.teacherNew.back"></span></a></div>
          </section>
        </div>
      </div>
    </main>
    <div data-include="partials/footer.html"></div>
  </body>
</html>

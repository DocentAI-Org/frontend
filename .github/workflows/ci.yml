name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request cancels its previous run; runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Whether the change needs the E2E suite (scripts/ci-changes.sh). Pushes to main run it.
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            printf 'app=true\n' | tee -a "$GITHUB_OUTPUT"
          else
            git diff --name-only "$BASE_SHA" HEAD | scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"
          fi

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run api:check
      - run: npm run lint
      - run: npm run knip
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # App E2E + axe against the typed mock backend. Each shard starts its own mock and app, so
  # the shards share no state.
  e2e-app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # A stalled browser download otherwise hangs the job until GitHub's 6-hour limit.
      - run: npx playwright install --with-deps chromium webkit
        timeout-minutes: 5
      - run: npx playwright test -c playwright.app.config.ts --shard=${{ matrix.shard }}/3
        env:
          CI: "true"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-app-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  # The demo deployment (DEMO_MODE=on): the app answers its API and Auth calls from sample data.
  e2e-demo:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # A stalled browser download otherwise hangs the job until GitHub's 6-hour limit.
      - run: npx playwright install --with-deps chromium webkit
        timeout-minutes: 5
      - run: npm run test:e2e:demo
        env:
          CI: "true"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-demo
          path: playwright-report/
          retention-days: 7
